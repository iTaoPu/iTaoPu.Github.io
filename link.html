<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件直鏈托管 · 穩定版</title>

    <link rel="icon" href="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/Glama.png" sizes="32x32">
    <link rel="icon" href="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/Glama.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/Glama.png">
    <link rel="shortcut icon" href="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/Glama.png" type="image/png">
    
    <style>
        /* 完全保留您原始代碼中的所有樣式 */
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-shadow: 0 10px 40px rgba(99, 102, 241, 0.1);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: rgba(226, 232, 240, 0.8);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --upload-bg: rgba(248, 250, 252, 0.8);
            --upload-hover: rgba(255, 255, 255, 0.9);
            --dragover-bg: rgba(99, 102, 241, 0.05);
            --input-bg: #f8fafc;
        }
        .dark-mode {
            --primary: #818cf8;
            --primary-light: #a5b4fc;
            --primary-dark: #6366f1;
            --secondary: #f472b6;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(71, 85, 105, 0.8);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --upload-bg: rgba(30, 41, 59, 0.8);
            --upload-hover: rgba(30, 41, 59, 0.9);
            --dragover-bg: rgba(99, 102, 241, 0.1);
            --input-bg: #1e293b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: var(--text-primary);
            padding: 20px;
            overflow-x: hidden;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            color: var(--primary);
            font-size: 20px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            color: var(--text-primary);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateX(-50%) translateY(20px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .header {
            text-align: center;
            width: 100%;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 16px;
            border: 4px solid var(--card-bg);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
            transition: transform 0.4s ease;
            object-fit: cover;
        }
        .avatar:hover { transform: scale(1.08) rotate(2deg); }
        .title {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }
        .card {
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 32px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            background: var(--upload-bg);
        }
        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--dragover-bg);
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .progress-section, .result-section {
            display: none;
            margin-top: 24px;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result-input-group {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 2px;
        }
        .result-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }
        .copy-btn {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="theme-toggle" id="themeToggle">🌞</div>
    <div class="toast" id="toast"></div>

    <div class="container">
        <div class="header">
            <img src="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/Glama.png" alt="头像" class="avatar">
            <h1 class="title">文件直鏈托管 · Telegraph</h1>
            <p class="subtitle">穩定可靠的文件直鏈生成服務 · 國內直連</p>
        </div>

        <div class="card">
            <div id="uploadForm">
                <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <div style="font-size: 40px;">📁</div>
                    <p style="font-size: 14px; font-weight: 600; margin-top: 8px;">點擊或拖拽上傳</p>
                    <input type="file" id="fileInput" hidden>
                </div>
                <button class="btn" onclick="document.getElementById('fileInput').click()">立即上傳文件</button>
            </div>

            <div class="progress-section" id="progressSection">
                <div class="loading-spinner"></div>
                <p style="text-align:center;">正在上傳到 Telegraph...</p>
            </div>

            <div class="result-section" id="resultSection">
                <div style="margin-bottom:15px">
                    <label style="font-size:12px; color:var(--text-secondary)">🔗 文件直鏈地址</label>
                    <div class="result-input-group">
                        <input type="text" id="fileLink" class="result-input" readonly>
                        <button class="copy-btn" onclick="copyLink()">複製</button>
                    </div>
                </div>
                <button class="btn" style="background:transparent; border:1px solid var(--primary); color:var(--primary); box-shadow:none;" onclick="location.reload()">重新上傳</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            
            themeToggle.addEventListener('click', () => {
                body.classList.toggle('dark-mode');
                themeToggle.textContent = body.classList.contains('dark-mode') ? '🌙' : '🌞';
            });

            const fileInput = document.getElementById('fileInput');
            const dropZone = document.getElementById('dropZone');

            dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
            dropZone.ondragleave = () => dropZone.classList.remove('dragover');
            dropZone.ondrop = (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length) handleUpload(e.dataTransfer.files[0]);
            };
            fileInput.onchange = (e) => {
                if (e.target.files.length) handleUpload(e.target.files[0]);
            };

            async function handleUpload(file) {
                document.getElementById('uploadForm').style.display = 'none';
                document.getElementById('progressSection').style.display = 'block';

                const formData = new FormData();
                formData.append('file', file);

                try {
                    // 更換為 Telegraph (Graph.org) 接口
                    const response = await fetch('https://graph.org/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    
                    if (result[0] && result[0].src) {
                        const finalUrl = 'https://graph.org' + result[0].src;
                        document.getElementById('fileLink').value = finalUrl;
                        document.getElementById('progressSection').style.display = 'none';
                        document.getElementById('resultSection').style.display = 'block';
                        showToast('上傳成功！', 'success');
                    } else {
                        throw new Error('Upload failed');
                    }
                } catch (error) {
                    showToast('上傳失敗，請重試', 'error');
                    location.reload();
                }
            }

            window.copyLink = () => {
                const el = document.getElementById('fileLink');
                el.select();
                document.execCommand('copy');
                showToast('已複製到剪貼板', 'success');
            };

            function showToast(msg, type) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.className = `toast ${type} show`;
                setTimeout(() => t.classList.remove('show'), 3000);
            }
        })();
    </script>
</body>
</html>
