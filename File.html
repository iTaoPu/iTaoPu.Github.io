<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>永久直链托管 - 稳定版</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(200, 200, 200, 0.3);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --text-primary: #333;
            --accent-color: #4a6cf7;
            --accent-hover: #3a5ce5;
            --body-bg: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
            padding: 15px;
            padding-top: 20px;
            background-color: var(--body-bg); /* 简洁的背景色 */
        }

        .avatar-container {
            text-align: center;
            margin-bottom: 0;
            line-height: 0;
        }
        .avatar-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: none;
            background: transparent;
            transition: transform 0.3s ease;
            display: block;
            margin: 0 auto;
        }
        .avatar-img:hover { transform: scale(1.05); }

        .page-title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3, #54a0ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 8s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-layer { width: 100%; max-width: 450px; margin-top: 0; }
        
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            padding: 25px;
            box-shadow: var(--glass-shadow);
            text-align: center;
            margin-top: 30px;
        }

        .upload-zone {
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
            transition: 0.3s;
            border: 2px dashed #e0e0e0;
        }
        .upload-zone:hover { 
            background: rgba(255, 255, 255, 0.95); 
            transform: scale(1.02);
            border-color: var(--accent-color);
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        #progressSection, #resultSection { display: none; margin-top: 20px; }
        .progress-bar { background: rgba(0,0,0,0.1); height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent-color); transition: 0.3s; }

        .result-item { text-align: left; margin-bottom: 15px; }
        .label { font-size: 11px; color: #666; font-weight: bold; margin-bottom: 4px; display: block; }
        .input-group {
            display: flex; 
            background: rgba(255,255,255,0.9); 
            border: 1px solid var(--glass-border); 
            border-radius: 6px; 
            padding: 4px;
        }
        .input-group input { flex: 1; background: transparent; border: none; padding: 6px; font-size: 12px; outline: none; }
        .btn-copy { background: var(--accent-color); color: white; border: none; padding: 0 12px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        
        #retryNotice { font-size: 11px; color: #888; margin-top: 5px; display: none; }
        
        /* 拖拽样式优化 */
        .upload-zone.dragover {
            background: rgba(74, 108, 247, 0.1);
            border: 2px dashed var(--accent-color);
        }
    </style>
    <!-- 百度统计代码 -->
    <script>
        var _hmt = _hmt || [];
        (function() {
          var hm = document.createElement("script");
          hm.src = "https://hm.baidu.com/hm.js?f463aebe70bb41d3370a497b28a6d7ac";
          var s = document.getElementsByTagName("script")[0]; 
          s.parentNode.insertBefore(hm, s);
        })();
    </script>
</head>
<body>
    <div class="main-layer">
        <div class="page-title">永久直链托管</div>
        
        <div class="avatar-container">
            <img class="avatar-img" src="https://cdn.jsdmirror.com/gh/iTaoPu/iTaoPu.Github.io@List/Gbastos.png" alt="头像" title="裤佬">
        </div>

        <div class="glass-card">
            <div id="uploadForm">
                <div class="upload-zone" id="dropZone">
                    <div style="font-size: 40px;">🔗</div>
                    <p style="font-size: 14px; color: #555; margin-top: 10px;">点击或将文件拖拽至此处</p>
                    <input type="file" id="fileInput" hidden>
                </div>
                <button class="btn" onclick="document.getElementById('fileInput').click()">选择文件并上传</button>
            </div>

            <div id="progressSection">
                <p style="font-size: 13px;">正在上传到云端永久储存中…</p>
                <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
                <p id="percentText" style="font-size: 12px; color: var(--accent-color);">0%</p>
                <p id="retryNotice">⚠️ 当前通道繁忙，正在切换备用线路...</p>
            </div>

            <div id="resultSection">
                <div class="result-item">
                    <span class="label">🚀 镜像加速链接</span>
                    <div class="input-group">
                        <input type="text" id="proxyLink" readonly>
                        <button class="btn-copy" onclick="copyValue('proxyLink', this)">复制</button>
                    </div>
                </div>
                <div class="result-item">
                    <span class="label">🔗 原始官方链接</span>
                    <div class="input-group">
                        <input type="text" id="rawLink" readonly>
                        <button class="btn-copy" onclick="copyValue('rawLink', this)">复制</button>
                    </div>
                </div>
                <button class="btn" style="background:transparent; border:1px solid var(--accent-color); color:var(--accent-color);" onclick="location.reload()">重新上传</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');

        // --- 修复拖拽功能 ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            dropZone.classList.add('dragover');
        }

        function unhighlight() {
            dropZone.classList.remove('dragover');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length) {
                handleUpload(files[0]);
            }
        }

        // --- 核心配置 ---
        const API = 'https://catbox.moe/user/api.php';
        const DOMAIN = 'https://down.nigx.cn/';
        
        // 代理池：顺序尝试
        const PROXY_POOL = [
            'https://corsproxy.io/?',
            'https://api.allorigins.win/raw?url='
        ];

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => { if(e.target.files[0]) handleUpload(e.target.files[0]); };
        
        async function handleUpload(file) {
            document.getElementById('uploadForm').style.display = 'none';
            document.getElementById('progressSection').style.display = 'block';

            const fd = new FormData();
            fd.append('reqtype', 'fileupload');
            fd.append('fileToUpload', file);

            let currentProxyIndex = 0;

            function startAjax() {
                const xhr = new XMLHttpRequest();
                // 修复代理URL拼接问题
                const targetUrl = PROXY_POOL[currentProxyIndex] + encodeURIComponent(API);
                
                xhr.open('POST', targetUrl);

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        document.getElementById('progressBar').style.width = percent + '%';
                        document.getElementById('percentText').innerText = percent + '%';
                    }
                };

                xhr.onload = () => {
                    const response = xhr.responseText.trim();
                    // 只要返回包含 http 就算成功
                    if (xhr.status === 200 && response.includes('http')) {
                        const urlMatch = response.match(/https?:\/\/[^\s]+/);
                        if (urlMatch) {
                            const raw = urlMatch[0];
                            const noProtocol = raw.replace(/^https?:\/\//, '');
                            document.getElementById('rawLink').value = raw;
                            document.getElementById('proxyLink').value = DOMAIN + noProtocol;
                            document.getElementById('progressSection').style.display = 'none';
                            document.getElementById('resultSection').style.display = 'block';
                            return;
                        }
                    }
                    tryNext();
                };

                xhr.onerror = () => tryNext();
                // 增加超时处理
                xhr.timeout = 30000; // 30秒超时
                xhr.ontimeout = () => tryNext();
                xhr.send(fd);
            }

            function tryNext() {
                currentProxyIndex++;
                if (currentProxyIndex < PROXY_POOL.length) {
                    document.getElementById('retryNotice').style.display = 'block';
                    console.warn('当前代理失效，尝试第 ' + (currentProxyIndex + 1) + ' 个代理');
                    startAjax();
                } else {
                    alert('上传失败：所有备用线路均不可用，请稍后再试。');
                    // 失败后返回上传界面
                    document.getElementById('progressSection').style.display = 'none';
                    document.getElementById('uploadForm').style.display = 'block';
                }
            }

            startAjax();
        }

        // 修复复制功能（兼容现代浏览器）
        function copyValue(id, btn) {
            const input = document.getElementById(id);
            input.select();
            try {
                // 使用现代的clipboard API
                navigator.clipboard.writeText(input.value).then(() => {
                    const originalText = btn.innerText;
                    btn.innerText = '成功';
                    setTimeout(() => btn.innerText = originalText, 2000);
                }).catch(err => {
                    // 降级方案
                    document.execCommand('copy');
                    const originalText = btn.innerText;
                    btn.innerText = '成功';
                    setTimeout(() => btn.innerText = originalText, 2000);
                });
            } catch (err) {
                document.execCommand('copy');
                const originalText = btn.innerText;
                btn.innerText = '成功';
                setTimeout(() => btn.innerText = originalText, 2000);
            }
        }
    </script>
</body>
</html>
