    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js"></script>
    <script src="js/flipclock.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const futureDate = new Date('2026-01-01T00:00:00+08:00');
            let clock;

            function initClock(diff) {
                clock = new FlipClock($('.clock'), diff, {
                    clockFace: 'DailyCounter',
                    countdown: true,
                    autoStart: false,
                    showSeconds: window.innerWidth > 600,
                    callbacks: {
                        stop: () => {
                            $('.message').html('<h5 class="green-text">活动进行中！</h5>');
                        }
                    }
                }).start();
            }

            function updateClock() {
                const now = new Date();
                const diff = Math.floor((futureDate - now) / 1000);

                if (diff <= 0) {
                    clock?.stop();
                    $('.message').html('<h5 class="red-text">倒计时已结束！</h5>');
                    return;
                }

                if (!clock) {
                    initClock(diff);
                } else {
                    clock.setTime(diff);
                    clock.start();
                }
            }

            M.AutoInit();
            updateClock();
            setInterval(updateClock, 1000);

            // 窗口大小变化处理
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    clock?.stop();
                    $('.clock').empty();
                    clock = null;
                    updateClock();
                }, 500);
            });
        });
    </script>
