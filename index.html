<!DOCTYPE html>

<head>
    <meta charset="utf-8"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        html, body { height: 100%; margin: 0; background-color: #1a1a1a; color: #ffffff; transition: background-color 0.3s ease; }
        body { display: flex; flex-direction: column; }
        main { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 0; }

        .header-title { font-size: 1.2rem !important; font-weight: 300; margin: 0 !important; color: #ff5252; letter-spacing: 4px; text-transform: uppercase; }
        .sub-text { font-size: 0.9rem; color: #757575; margin-bottom: 5px; }

        /* --- 時鐘巨大化核心 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in, transform 0.3s ease;
            /* 顯著增大比例：從 1.3 提升至 1.8 */
            transform: scale(clamp(0.8, 12vw, 1.8)); 
            margin: clamp(60px, 12vh, 120px) 0; 
        }
        
        .flip-clock-wrapper { margin: 0 !important; display: flex !important; justify-content: center; width: auto !important; }
        .flip-clock-divider .flip-clock-label { display: none !important; }
        .flip-clock-wrapper ul li a div div.inn { background-color: #333333 !important; color: #ff5252 !important; border-radius: 6px; }
        .flip-clock-dot { background: #ff5252 !important; }

        /* 全螢幕下的特殊處理 */
        :fullscreen .clock-wrapper { transform: scale(2.2); }
        :fullscreen nav { display: none; }

        /* 按鈕組 */
        .control-group { position: fixed; right: 20px; bottom: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }

        .light-mode { background-color: #f5f5f5 !important; color: #212121 !important; }
        .light-mode .flip-clock-wrapper ul li a div div.inn { background-color: #ffffff !important; color: #000000 !important; border: 1px solid #ddd; }
        .light-mode .flip-clock-dot { background: #000000 !important; }
    </style>
</head>

<body>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            // 1. 全螢幕功能
            $('#fs-btn').on('click', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    $(this).find('i').text('fullscreen_exit');
                } else {
                    document.exitFullscreen();
                    $(this).find('i').text('fullscreen');
                }
            });

            // 2. 名言系統 (支持本地備份 + 在線更新)
            let quotes = ["「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」 —— 魯迅"]; 
            
            function updateQuote() {
                const el = $('#quote-text');
                el.css('opacity', 0);
                setTimeout(() => {
                    const pick = quotes[Math.floor(Math.random() * quotes.length)];
                    el.text(pick).css('opacity', 1);
                }, 500);
            }

            // 這裡可以換成你的 API 網址
            // fetch('https://api.myjson.online/v1/records/xxxx') 
            // .then(r => r.json()).then(data => { quotes = data; updateQuote(); });

            setInterval(updateQuote, 300000); // 每 5 分鐘自動換一句
            updateQuote();

            // 3. 原有時鐘邏輯 (略...)
            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            const clock = $('.clock').FlipClock(getBeijingTime(), {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            $('#timer-container').css('opacity', '1');
            @@MATH_BLOCK_0@@('body').toggleClass('light-mode'));
        });
    </script>
