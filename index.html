<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.GitHub.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.GitHub.io/Jing.png"/>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>“閒”是生活的標點</title>

    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            background-color: #f5f5f5;
            margin: 0;
        }

        /* 強制全局水平居中 */
        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* --- FlipClock 視覺美化 --- */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        
        .flip-clock-dot {
            background: #ff5252 !important;
            box-shadow: none !important;
        }

        .flip-clock-divider .flip-clock-label {
            color: #757575 !important;
            font-weight: bold;
        }

        /* 時鐘容器：確保寬度自適應內容並置中 */
        .clock-wrapper {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            overflow: visible;
        }
        
        .clock-wrapper.loaded {
            opacity: 1;
        }

        /* --- 響應式適配 --- */
        @media only screen and (max-width: 600px) {
            h1.header {
                font-size: 2.2rem !important;
                margin-top: 1.5rem;
                letter-spacing: 1px;
            }

            /* 手機端縮放：FlipClock 是固定寬度，必須縮放 */
            .clock {
                transform: scale(0.6);
                transform-origin: center center;
                margin: -30px 0 !important; /* 減少縮放後的上下留白 */
            }
            
            /* 讓手機端導航欄按鈕更明顯 */
            .sidenav-trigger {
                display: block !important;
            }
        }

        main {
            flex: 1 0 auto;
            display: flex;
            align-items: center; /* 垂直居中內容（可選） */
        }
    </style>
</head>

<body>
    <nav class="grey darken-4" role="navigation">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
                <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
                <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
                <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li class="active"><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
        <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
        <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
        <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
    </ul>
    
    <main>
        <div class="container center-container">
            <div class="section">
                <h1 class="header red-text text-accent-2">“閒”是生活的標點</h1>
                <p class="grey-text">距離 2027 年還有</p>
                
                <div class="clock-wrapper">
                    <div class="clock"></div>
                </div>
                <div class="message"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="container">
            <div class="row">
                <div class="col s12 center-align">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」 —— 魯迅</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright grey darken-4">
            <div class="container center-align">
                &copy; 2022-2026 菜鳥驛站·樂玩公社
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js"></script>
    <script src="https://iTaoPu.GitHub.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            // 核心：初始化側邊欄元件
            var elems = document.querySelectorAll('.sidenav');
            M.Sidenav.init(elems);

            const futureDate = new Date('2027-01-01T00:00:00+08:00');
            const now = new Date();
            const diff = Math.floor((futureDate - now) / 1000);

            if (diff > 0) {
                const clock = $('.clock').FlipClock(diff, {
                    clockFace: 'DailyCounter',
                    countdown: true
                });
                $('.clock-wrapper').addClass('loaded');
            } else {
                $('.message').html('<h5 class="red-text">新的旅程已經開始！</h5>');
                $('.clock-wrapper').hide();
            }
        });
    </script>
</body>
</html>
