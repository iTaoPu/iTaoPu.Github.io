<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f5f5f5;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- 文字大小調整 --- */
        .header-title {
            font-size: 1.5rem !important; /* 縮小標題 */
            font-weight: 400;
            margin: 0 !important;
            color: #ff5252;
        }

        .sub-text {
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* --- 時鐘放大邏輯 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            opacity: 0;
            transition: opacity 1s;
            /* PC 端放大 */
            transform: scale(1.5); 
            margin: 60px 0; /* 補償放大後的間距 */
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        /* 隱藏標籤 */
        .flip-clock-divider .flip-clock-label {
            display: none !important;
        }

        /* 顏色自定義 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 移動端適配 --- */
        @media only screen and (max-width: 600px) {
            .header-title { font-size: 1.2rem !important; }
            .clock-wrapper {
                transform: scale(0.8); /* 手機端適度放大，確保不超出寬度 */
                margin: 20px 0;
            }
        }
    </style>
</head>

<body>
    <nav class="grey darken-4">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
                <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
                <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
                <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="grey-text sub-text">北京實時時間</p>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="footer-copyright grey darken-4">
            <div class="container">&copy; 2022-2026 菜鳥驛站·樂玩公社</div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                const bjTime = new Date(utc + (3600000 * 8));
                return bjTime;
            }

            const clock = $('.clock').FlipClock({
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            const bjNow = getBeijingTime();
            clock.setTime(bjNow);

            $('#timer-container').css('opacity', '1');
        });
    </script>
</body>
</html>
