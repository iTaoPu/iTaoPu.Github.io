    <style>
        /* --- 頁面結構優化 --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            transition: background-color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;   
            padding: 40px 0;
        }

        /* --- Logo 樣式修正 --- */
        .brand-logo {
            display: flex !important;
            align-items: center;
            height: 100% !important;
            position: relative !important;
            padding: 0 15px !important;
            z-index: 10;
        }
        .brand-logo img {
            height: 32px;
            width: auto;
            transition: transform 0.3s ease;
        }
        .brand-logo:hover img {
            transform: rotate(15deg) scale(1.1);
        }

        /* --- 文青風格標題 --- */
        .header-title {
            font-family: 'Noto Serif TC', serif !important;
            font-size: 1.6rem !important;
            font-weight: 600;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 6px; 
            text-shadow: 2px 2px 8px rgba(255, 82, 82, 0.2), 
                                 1px 1px 2px rgba(0, 0, 0, 0.3);
            line-height: 1.5;
            writing-mode: horizontal-tb; 
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 5px;
        }

        /* --- 時鐘巨大化核心 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            transform: scale(clamp(0.65, 8vw, 1.3));
            margin: clamp(40px, 10vh, 100px) 0;
        }
       
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label {
            display: none !important;
        }

        /* 顏色自定義：深灰底紅字 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
            backface-visibility: hidden;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 導航欄增強與毛玻璃優化 --- */
        nav.black {
            background-color: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            transform: translateZ(0);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none !important;
        }

        .nav-wrapper ul li a {
            transition: color 0.3s ease, background-color 0.3s ease;
            position: relative;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        .nav-wrapper ul li a:hover {
            color: #ff5252 !important;
            background-color: rgba(255, 255, 255, 0.05) !important;
        }

        .nav-wrapper ul li a::after {
            content: '';
            position: absolute; width: 0; height: 2px; bottom: 0; left: 50%;
            background-color: #ff5252;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-wrapper ul li a:hover::after { width: 70%; }

        /* --- 移動端適配 --- */
        @media only screen and (max-width: 992px) {
            nav .brand-logo.left {
                left: 0 !important;
                transform: none !important;
            }
            .brand-logo img { height: 28px; }
        }
        @media only screen and (max-width: 768px) {
            .clock-wrapper { transform: scale(0.85); margin: 40px 0; }
        }
        @media only screen and (max-width: 480px) {
            .clock-wrapper { transform: scale(0.75); margin: 20px 0; }
            .header-title { font-size: 1.6rem !important; }
        }

        /* 頁腳 */
        .page-footer {
            padding-top: 20px;
            background-color: #121212 !important;
            transition: background-color 0.3s ease;
        }

        #hitokoto_text { font-style: italic; transition: opacity 0.5s ease; }
        #hitokoto_from { font-size: 0.8rem; margin-left: 10px; }

        /* 右下角切換按鈕 */
        #theme-toggle-fab { position: fixed; right: 20px; bottom: 20px; z-index: 1000; }
        #theme-toggle-fab a { width: 45px; height: 45px; line-height: 45px; }
        #theme-toggle-fab a i { line-height: 45px; font-size: 1.5rem; transition: transform 0.3s ease; }
        #theme-toggle-fab a:hover i { transform: rotate(30deg); }

        /* 側邊欄樣式 */
        .sidenav { background-color: #212121 !important; }
        .sidenav li a { color: #ffffff !important; }
        .sidenav li a i { color: #ffffff !important; }

        /* --- 淺色模式樣式 --- */
        body.light-mode {
            background-color: #f5f5f5 !important;
            color: #212121 !important;
        }

        body.light-mode nav { 
            background-color: rgba(255, 255, 255, 0.7) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        body.light-mode nav ul a, body.light-mode nav i { 
            color: #212121 !important; 
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }
        body.light-mode .sidenav-trigger i { color: #212121 !important; }
       
        body.light-mode .sidenav { background-color: #ffffff !important; }
        body.light-mode .sidenav li a { color: #212121 !important; }
        body.light-mode .sidenav li a i { color: #212121 !important; }
        
        /* 修復側邊欄「蜂巢」背景與文字 Bug */
        body.light-mode .sidenav li .user-view .background.black { background-color: #eeeeee !important; }
        body.light-mode .sidenav li .user-view .white-text.name { color: #212121 !important; }

        body.light-mode .sub-text { color: #424242 !important; }
        body.light-mode #bj-date { color: #212121 !important; }

        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #000000 !important;
            text-shadow: none !important;
            border: 1px solid #ddd;
        }
        body.light-mode .flip-clock-dot { background: #000000 !important; }

        body.light-mode .page-footer { background-color: #eeeeee !important; }
        body.light-mode .footer-copyright { background-color: #e0e0e0 !important; }
        body.light-mode .page-footer p, body.light-mode .page-footer h6 a { color: #212121 !important; }
    </style>
</head>

    <script src="https://fastly.jsdelivr.net/gh/iTaoPu/iTaoPu.Github.io@List/js/jquery.min.js"></script>
    <script src="https://fastly.jsdelivr.net/gh/iTaoPu/iTaoPu.Github.io@List/js/materialize.min.js"></script>
    <script src="https://fastly.jsdelivr.net/gh/iTaoPu/iTaoPu.Github.io@List/js/flipclock.js"></script>
   
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();
            const savedTheme = localStorage.getItem('theme');
            function applyAutoTheme() {
                const hour = new Date().getHours();
                if (hour >= 6 && hour < 18) { $('body').addClass('light-mode'); } 
                else { $('body').removeClass('light-mode'); }
            }
            if (!savedTheme) { applyAutoTheme(); } 
            else if (savedTheme === 'light') { $('body').addClass('light-mode'); }

            $('#theme-toggle-fab').on('click', function() {
                $('body').toggleClass('light-mode');
                localStorage.setItem('theme', $('body').hasClass('light-mode') ? 'light' : 'dark');
            });

            function fetchHitokoto() {
                fetch('https://v1.hitokoto.cn')
                    .then(response => response.json())
                    .then(data => {
                        $('#hitokoto_text').text(data.hitokoto);
                        if (data.from) { $('#hitokoto_from').text('—— ' + data.from); }
                    })
                    .catch(console.error);
            }
            fetchHitokoto();

            let timeOffset = 0;
            function getBeijingTime() {
                const now = new Date();
                const correctedNow = new Date(now.getTime() + timeOffset);
                const utc = correctedNow.getTime() + (correctedNow.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }
            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            const clock = $('.clock').FlipClock(getBeijingTime(), {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            async function syncWithNTP() {
                const apis = [{ name: '蘇寧', url: 'https://quan.suning.com/getSysTime.do', parser: (d) => new Date(d.datetime).getTime() }];
                let success = false;
                for (let api of apis) {
                    try {
                        const startTime = Date.now();
                        const response = await fetch(api.url, { cache: 'no-store' });
                        if (!response.ok) continue;
                        const data = await response.json();
                        const serverTime = api.parser(data);
                        const endTime = Date.now();
                        const latency = (endTime - startTime) / 2;
                        timeOffset = (serverTime + latency) - endTime;
                        if (Math.abs(timeOffset) > 1000) clock.setTime(getBeijingTime());
                        $('#sync-status').fadeOut(500, function() {
                            $(this).html('<i class="material-icons" style="font-size:14px; vertical-align:middle;">cloud_done</i> 蜂巢時間已同步').css('color', '#4caf50').fadeIn();
                        });
                        success = true; break;
                    } catch (e) {}
                }
            }
            setTimeout(syncWithNTP, 1800);
            setInterval(() => { updateDate(); syncWithNTP(); fetchHitokoto(); }, 3600000);
        });
    </script>
