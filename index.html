<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.GitHub.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.GitHub.io/Jing.png"/>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點</title>

    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            background-color: #f5f5f5;
            margin: 0;
            overflow-x: hidden; /* 防止時鐘縮放前撐開寬度 */
        }

        /* 標題與時鐘對齊容器 */
        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* --- FlipClock 視覺美化 --- */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
        }
        .flip-clock-dot { background: #ff5252 !important; box-shadow: none !important; }
        .flip-clock-divider .flip-clock-label { color: #757575 !important; font-weight: bold; }

        /* 時鐘容器修正：必須給予寬高，否則手機端無法渲染 */
        .clock-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            min-height: 120px; /* 給予基礎高度，防止高度為 0 */
            margin-top: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .clock-wrapper.loaded { opacity: 1; }

        /* --- 手機端顯示關鍵：使用 scale 縮小並處理溢出 --- */
        @media only screen and (max-width: 600px) {
            h1.header { font-size: 2rem !important; margin-top: 1.5rem; }
            
            .clock {
                /* 強制縮放並確保寬度不被限制 */
                transform: scale(0.55) !important;
                transform-origin: center center !important;
                margin: -40px 0 !important; /* 消除縮放後的白邊 */
                width: auto !important;
                display: block !important;
            }

            .flip-clock-wrapper {
                margin: 0 !important;
                width: 100% !important;
            }
        }

        main { flex: 1 0 auto; display: flex; align-items: center; }
    </style>
</head>

<body>
    <nav class="grey darken-4" role="navigation">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger" style="display: block;"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
                <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
                <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
                <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
        <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
        <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
        <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
    </ul>
    
    <main>
        <div class="container center-container">
            <h1 class="header red-text text-accent-2">“閒”是生活的標點</h1>
            <p class="grey-text">距離 2027 年還有</p>
            
            <div class="clock-wrapper">
                <div class="clock"></div>
            </div>
            <div id="message"></div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="container center-align">
            <h5 class="white-text">蜂巢·隱曜</h5>
            <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」</p>
        </div>
        <div class="footer-copyright grey darken-4">
            <div class="container center-align">&copy; 2022-2026 菜鳥驛站·樂玩公社</div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js"></script>
    <script src="https://iTaoPu.GitHub.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            // 初始化選單
            $('.sidenav').sidenav();

            const futureDate = new Date('2027-01-01T00:00:00+08:00');
            const now = new Date();
            const diff = (futureDate.getTime() - now.getTime()) / 1000;

            if (diff > 0) {
                // 在手機端 FlipClock 有時需要延遲一點點初始化以確保寬度計算正確
                setTimeout(function() {
                    const clock = $('.clock').FlipClock(diff, {
                        clockFace: 'DailyCounter',
                        countdown: true
                    });
                    $('.clock-wrapper').addClass('loaded');
                }, 100);
            } else {
                $('#message').html('<h5 class="red-text">倒計時已結束！</h5>');
            }
        });
    </script>
</body>
</html>
