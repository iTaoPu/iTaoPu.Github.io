    <meta charset="utf-8"/>

    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        /* --- 頁面結構優化 --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a; /* 改為深色背景，更有質感 */
            color: #eee;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 40px 0;
            overflow: hidden; /* 防止縮放導致的滾動條 */
        }

        /* --- 文字比例與字體 --- */
        .header-title {
            font-size: 1.4rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 4px;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        #bj-date {
            font-family: "Monaco", "Consolas", monospace; /* 等寬字體防止抖動 */
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: #9e9e9e;
        }

        /* --- 時鐘巨大化與佈局修正 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            
            /* 使用 transform 縮放，並透過 margin 補償空間 */
            transform: scale(1.8); 
            margin: 110px 0; 
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            width: auto !important;
        }

        /* 隱藏標籤 */
        .flip-clock-divider .flip-clock-label { display: none !important; }

        /* 顏色：深灰底紅字 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 移動端適配 --- */
       @media only screen and (max-width: 600px) {
            .clock-wrapper {
                transform: scale(0.75); /* 手機端縮放，避免數字跑出螢幕 */
                margin: 10px 0;
            }
            .header-title { font-size: 1.1rem !important; }
        }

        .page-footer { padding-top: 20px; }
    </style>
</head>

<body>

                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
                <li><a href="/">Home</a></li>

    </ul>
    
    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">BEIJING TIME</p>
            <div id="bj-date">載入中...</div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer grey darken-4">
        <div class="container">
            <div class="row">
                <div class="col l8 s12">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」 —— 魯迅</p>
                </div>

        <div class="footer-copyright black">

            </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            let timeOffset = 0; // 與標準時間的偏差（毫秒）

            // 獲取精確北京時間並校準
            async function syncTime() {
                try {
                    const response = await fetch('https://time.is/Beijing');
                    const data = await response.json();
                    const serverTime = new Date(data.datetime).getTime();
                    const localTime = Date.now();
                    timeOffset = serverTime - localTime; // 計算本地與服務器的偏差
                    console.log("校時成功，偏差量(ms):", timeOffset);
                } catch (err) {
                    console.warn("校時服務不可用，切換為本地時區換算模式");
                    timeOffset = 0;
                }
                updateDate();
            }

            function getCalibratedTime() {
                const now = new Date(Date.now() + timeOffset);
                // 強制轉換為 UTC+8 (北京)
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getCalibratedTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-CN', options));
            }

            // 初始化時鐘
            const clock = $('.clock').FlipClock({
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            // 執行同步
            syncTime().then(() => {
                clock.setTime(getCalibratedTime());
                $('#timer-container').css('opacity', '1');
            });

            // 每隔 60 秒檢查一次日期更新，每 10 分鐘重新校準一次 API
            setInterval(updateDate, 60000);
            setInterval(syncTime, 600000);
        });
    </script>
</body>
