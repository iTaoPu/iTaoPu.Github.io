<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>“閒”是生活的標點</title>

    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            background-color: #f5f5f5;
        }

        /* --- PC 端居中與基礎樣式 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 40px 0;
            opacity: 0;
            transition: opacity 1s;
        }
        
        /* 修正 FlipClock 預設浮動問題 */
        .flip-clock-wrapper {
            margin: 0 auto !important;
            display: table !important;
            width: auto !important;
            clear: both;
        }

        /* FlipClock 顏色美化 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
        }
        .flip-clock-dot { background: #ff5252 !important; }
        .flip-clock-divider .flip-clock-label { color: #757575 !important; font-weight: bold; }

    @media only screen and (max-width: 800px) {
        h1.header { font-size: 2rem !important; }

        .clock-wrapper {
            padding: 20px 0;
            min-height: 450px; /* 為三行預留足夠高度 */
        }

        .flip-clock-wrapper {
            display: flex !important;
            flex-wrap: wrap; 
            justify-content: center;
            transform: scale(0.8);
            transform-origin: center top;
            max-width: 100%;
        }

        /* 重置所有 divider 寬度，避免干擾自定義斷行 */
        .flip-clock-divider {
            float: none !important;
            width: 20px !important;
        }

        /* --- 第一行：天 --- */
        /* 強制在 Days 的兩個數字後斷行 */
        .flip-clock-wrapper ul.days + ul {
            margin-right: 100% !important; /* 強制後方元素換行 */
            margin-bottom: 60px !important; /* 與第二行的間距 */
        }

        /* --- 第二行：小時 + 分鐘 --- */
        /* 隱藏小時前面的冒號（因為它現在是行首） */
        .flip-clock-divider.hours {
            display: none !important;
        }

        /* 強制在 Minutes 的兩個數字後斷行 */
        .flip-clock-wrapper ul.minutes + ul {
            margin-right: 100% !important; /* 強制秒鐘換到第三行 */
            margin-bottom: 60px !important;
        }

        /* --- 第三行：秒 --- */
        /* 隱藏秒鐘前面的冒號 */
        .flip-clock-divider.seconds {
            display: none !important;
        }

        /* --- 標籤優化 (天/時/分/秒 文字) --- */
        .flip-clock-divider .flip-clock-label {
            right: auto !important;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            top: auto !important;
            bottom: -40px !important; /* 標籤統一放在數字下方 */
            font-size: 18px !important;
            color: #757575 !important;
        }

        /* 讓每一組的標籤能準確定位到兩位數字的中間 */
        .flip-clock-divider.days .flip-clock-label { margin-left: 65px; }
        .flip-clock-divider.hours .flip-clock-label { display: block !important; visibility: visible; margin-left: 65px; }
        .flip-clock-divider.minutes .flip-clock-label { margin-left: 65px; }
        .flip-clock-divider.seconds .flip-clock-label { display: block !important; visibility: visible; margin-left: 65px; }

        .flip-clock-wrapper ul {
            margin: 5px !important;
        }
    }
</style>
</head>

<body>

    <main>
        <div class="container center-align">
            <br><br>
            <h1 class="header red-text text-accent-2">“閒”是生活的標點</h1>
            <p class="grey-text">距離 2027 年還有</p>

                <div class="clock"></div>

    <script type="text/javascript">
        $(document).ready(function() {
            // 初始化側邊欄
            $('.sidenav').sidenav();

            const futureDate = new Date('2027-01-01T00:00:00+08:00');
            const now = new Date();
            const diff = Math.floor((futureDate.getTime() - now.getTime()) / 1000);

            if (diff > 0) {
                setTimeout(function() {
                    const clock = $('.clock').FlipClock(diff, {
                        clockFace: 'DailyCounter',
                        countdown: true
                    });
                    $('#timer-container').css('opacity', '1');
                }, 300);
            } else {
                $('#message').html('<h5 class="red-text">新的旅程已經開始！</h5>');
            }
        });
    </script>
