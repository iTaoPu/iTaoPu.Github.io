<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>“閒”是生活的標點</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            background-color: #f5f5f5;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }

        main { flex: 1 0 auto; }

        /* --- 時鐘基礎樣式 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 40px 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        
        .flip-clock-wrapper {
            margin: 0 auto !important;
            display: inline-block !important;
            width: auto !important;
        }

        /* 顏色自定義 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
        }
        .flip-clock-dot { background: #ff5252 !important; }
        .flip-clock-divider .flip-clock-label { 
            color: #757575 !important; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        /* --- 手機端響應式核心 (斷行邏輯) --- */
        @media only screen and (max-width: 600px) {
            h1.header { font-size: 2.5rem !important; margin-top: 20px; }
            
            .clock-wrapper {
                padding: 20px 0;
                min-height: 320px;
            }

            .flip-clock-wrapper {
                transform: scale(0.65); /* 縮小以適應手機寬度 */
                transform-origin: center top;
                display: flex !important;
                flex-wrap: wrap;
                justify-content: center;
            }

            /* 強制在「小時」後斷行：DailyCounter 結構中，第 4 個 ul 後面是小時的結束 */
            .flip-clock-wrapper ul:nth-child(4) {
                margin-right: 100% !important; /* 強制後方元素換到下一行 */
                margin-bottom: 80px !important; /* 增加上下兩行的間距 */
            }

            /* 修正手機端標籤位置 */
            .flip-clock-divider { height: 100px !important; }
            .flip-clock-divider.minutes .flip-clock-label,
            .flip-clock-divider.seconds .flip-clock-label {
                top: 10px !important;
            }
        }

        .footer-left { text-align: left !important; }
    </style>
</head>

<body>
    <nav class="grey darken-4" role="navigation">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">首頁</a></li>
                <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
                <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
                <li><a href="https://5iclub.blogspot.com" target="_blank">部落格</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><a href="/">Home</a></li>
        <li class="divider"></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
        <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
        <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
        <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
        <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
    </ul>
    
    <main>
        <div class="container center-align">
            <br><br>
            <h1 class="header red-text text-accent-2">“閒”是生活的標點</h1>
            <p class="grey-text text-darken-1 flow-text">距離 2027 年還有</p>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
            
            <div id="message"></div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="container">
            <div class="row">
                <div class="col l8 s12 footer-left">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」 —— 魯迅</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright grey darken-4">
            <div class="container footer-left">
                &copy; 2022-2026 菜鳥驛站·樂玩公社
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            // 初始化 Materialize 元件
            $('.sidenav').sidenav();

            // 設定目標時間 (2027年1月1日 台北/北京時區)
            const futureDate = new Date('2027-01-01T00:00:00+08:00');
            const now = new Date();
            const diff = Math.floor((futureDate.getTime() - now.getTime()) / 1000);

            if (diff > 0) {
                // 初始化時鐘
                const clock = $('.clock').FlipClock(diff, {
                    clockFace: 'DailyCounter',
                    countdown: true,
                    language: 'zh-tw'
                });
                
                // 漸顯效果
                $('#timer-container').css('opacity', '1');
            } else {
                $('#message').html('<h4 class="red-text pulse">新的旅程已經開始！</h4>');
            }
        });
    </script>
</body>
</html>
