<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        /* --- 頁面結構優化 --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a; 
            color: #ffffff;
            transition: background-color 0.3s ease;
            overflow-x: hidden; /* 防止縮放導致的水平滾動條 */
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 40px 0;
        }

        /* 核心限制容器：防止在超寬螢幕下內容太過分散 */
        .content-limit {
            width: 100%;
            max-width: 1200px; 
            margin: 0 auto;
            text-align: center;
        }

        /* --- 文字比例優化 --- */
        .header-title {
            font-size: clamp(1.2rem, 3vw, 1.8rem) !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        /* --- 時鐘縮放核心優化 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            /* 動態縮放：最小0.7倍，隨寬度變化，PC端最大鎖定在1.3倍避免過大 */
            transform: scale(clamp(0.65, 8vw, 1.3)); 
            margin: clamp(40px, 10vh, 100px) 0; 
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label { display: none !important; }

        /* 顏色自定義 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 導航欄與交互 --- */
        .nav-wrapper ul li a { transition: all 0.3s ease; position: relative; }
        .nav-wrapper ul li a:hover { color: #ff5252 !important; background-color: rgba(255, 255, 255, 0.05) !important; }
        .nav-wrapper ul li a::after {
            content: ''; position: absolute; width: 0; height: 2px; bottom: 0; left: 50%;
            background-color: #ff5252; transition: all 0.3s ease; transform: translateX(-50%);
        }
        .nav-wrapper ul li a:hover::after { width: 70%; }

        /* 右下角按鈕 */
        #theme-toggle-fab { position: fixed; right: 20px; bottom: 20px; z-index: 1000; }
        #theme-toggle-fab a:hover i { transform: rotate(30deg); }

        /* --- 淺色模式 --- */
        body.light-mode { background-color: #f5f5f5 !important; color: #212121 !important; }
        body.light-mode nav { background-color: #ffffff !important; }
        body.light-mode nav ul a, body.light-mode nav i { color: #424242 !important; }
        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #000000 !important; 
            text-shadow: none !important;
            border: 1px solid #ddd;
        }
        body.light-mode .flip-clock-dot { background: #000000 !important; }
        body.light-mode .page-footer { background-color: #eeeeee !important; }
        body.light-mode .footer-copyright { background-color: #e0e0e0 !important; }
    </style>
</head>

<body>

    <ul class="sidenav" id="nav-mobile">
        <li><div class="user-view"><div class="background black"></div><span class="white-text name">蜂巢·隱曜</span></div></li>
        <li><a href="/">Home</a></li>

        <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
    </ul>
    
    <main>
        <div class="content-limit">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">BEIJING TIME</p>
            <div id="bj-date" class="grey-text text-lighten-1" style="font-size: 0.9rem; margin-bottom: 20px; font-weight: 300;"></div>
            <div id="sync-status" style="font-size: 0.85rem; transition: all 0.5s ease;">校準授時中...</div>

                <div class="clock"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') { $('body').addClass('light-mode'); }

            $('#theme-toggle-fab').on('click', function() {
                $('body').toggleClass('light-mode');
                localStorage.setItem('theme', $('body').hasClass('light-mode') ? 'light' : 'dark');
            });

            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            const clock = $('.clock').FlipClock(getBeijingTime(), {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            setTimeout(function() {
                $('#sync-status').fadeOut(800, function() {
                    $(this).html('<i class="material-icons" style="font-size:14px; vertical-align:middle;">check_circle</i> 蜂巢時間已同步 (UTC+8)')
                           .css('color', '#4caf50').fadeIn();
                });
            }, 1800);

            setInterval(updateDate, 3600000);
        });
    </script>
</body>
