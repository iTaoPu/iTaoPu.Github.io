<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>“閒”是生活的標點</title>

    <style>
    body {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        background-color: #f5f5f5;
    }

    /* --- PC 端基礎樣式 --- */
    .clock-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 40px 0;
        opacity: 0;
        transition: opacity 1s;
    }
    
    .flip-clock-wrapper {
        margin: 0 auto !important;
        display: flex !important; /* 使用 Flex 佈局 */
        justify-content: center;
        width: auto !important;
    }

    /* FlipClock 顏色美化 */
    .flip-clock-wrapper ul li a div div.inn {
        background-color: #333333 !important;
        color: #ff5252 !important;
        text-shadow: 0 1px 2px #000;
    }
    .flip-clock-dot { background: #ff5252 !important; }
    .flip-clock-divider .flip-clock-label { color: #757575 !important; font-weight: bold; }

    /* --- 手機端兩行顯示核心解決方案 --- */
    @media only screen and (max-width: 800px) {
        h1.header { font-size: 2.2rem !important; }

        .flip-clock-wrapper {
            flex-wrap: wrap; /* 允許換行 */
            transform: scale(0.7); /* 縮小比例以適應窄屏 */
            transform-origin: center top;
            max-width: 320px; /* 限制寬度強制其換行 */
        }

        /* 標籤位置修正：在兩行模式下，標籤若太靠右會被遮擋 */
        .flip-clock-divider .flip-clock-label {
            right: -75px !important; 
        }

        /* 強制斷行邏輯：
           DailyCounter 的結構是：Days (divider+ul+ul), Hours (divider+ul+ul), Minutes...
           我們讓「分鐘」前面的 divider 佔據 100% 寬度，從而實現強制換行 */
        .flip-clock-divider.minutes {
            width: 100% !important;
            height: 40px !important; /* 第一行與第二行的垂直間距 */
            float: none !important;
            clear: both;
            visibility: hidden; /* 隱藏這個用來斷行的 divider */
        }

        /* 調整換行後第二行（分鐘和秒）的對齊 */
        .flip-clock-divider.minutes + ul,
        .flip-clock-divider.seconds {
            margin-top: 10px;
        }

        .clock-wrapper {
            padding: 20px 0;
            min-height: 280px; /* 給兩行留出足夠空間 */
        }
    }

    main { flex: 1 0 auto; }
    .footer-left { text-align: left !important; }
</style>
</head>

<body>

    </ul>
    
    <main>
        <div class="container center-align">
            <br><br>
            <h1 class="header red-text text-accent-2">“閒”是生活的標點</h1>
            <p class="grey-text">距離 2027 年還有</p>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
            <div id="message"></div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">

                <div class="col l8 s12 footer-left">
                    <h5 class="white-text">蜂巢·隱曜</h5>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            // 初始化側邊欄
            $('.sidenav').sidenav();

            const futureDate = new Date('2027-01-01T00:00:00+08:00');
            const now = new Date();
            const diff = Math.floor((futureDate.getTime() - now.getTime()) / 1000);

            if (diff > 0) {
                setTimeout(function() {
                    const clock = $('.clock').FlipClock(diff, {
                        clockFace: 'DailyCounter',
                        countdown: true
                    });
                    $('#timer-container').css('opacity', '1');
                }, 300);
            } else {
                $('#message').html('<h5 class="red-text">新的旅程已經開始！</h5>');
            }
        });
    </script>
