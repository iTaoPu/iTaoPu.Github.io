<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>“閒”是生活的標點</title>

    <style>
    /* ... 保持 body 和 PC 端樣式不變 ... */

    @media only screen and (max-width: 800px) {
        h1.header { font-size: 2.2rem !important; }

        .clock-wrapper {
            padding: 10px 0;
            min-height: 400px; /* 增加高度以容納三行 */
        }

        .flip-clock-wrapper {
            display: flex !important;
            flex-wrap: wrap; /* 允許彈性換行 */
            justify-content: center;
            transform: scale(0.8);
            transform-origin: center top;
        }

        /* 1. 在「天」之後斷行 */
        .flip-clock-divider.days + ul + ul + .flip-clock-divider.hours {
            display: none !important; /* 隱藏小時前的冒號點，避免排版混亂 */
        }
        
        /* 強制小時開始新的一行 */
        .flip-clock-wrapper ul.days + ul + .flip-clock-divider.hours,
        .flip-clock-divider.hours {
            width: 100% !important;
            height: 50px !important; /* 第一行與第二行的間距 */
            float: none !important;
            clear: both;
            visibility: hidden;
        }

        /* 2. 在「小時」之後斷行 (即分鐘開始新的一行) */
        .flip-clock-divider.minutes {
            width: 100% !important;
            height: 50px !important; /* 第二行與第三行的間距 */
            float: none !important;
            clear: both;
            visibility: hidden;
        }

        /* 修正標籤位置，確保在三行模式下居中顯示 */
        .flip-clock-divider .flip-clock-label {
            right: auto !important;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            top: auto !important;
            bottom: -35px !important; /* 將標籤（天、時、分）移到數字下方 */
            color: #757575 !important;
        }

        /* 調整每一行數字塊的外邊距 */
        .flip-clock-wrapper ul {
            margin: 10px 5px 30px 5px !important;
        }
    }
</style>
</head>

<body>
    <nav class="grey darken-4" role="navigation">
        <div class="nav-wrapper container">

                <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
                <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
        <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
        <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
        <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
        <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
    </ul>
    
    <main>
        <div class="container center-align">
            <br><br>
            <h1 class="header red-text text-accent-2">“閒”是生活的標點</h1>
            <p class="grey-text">距離 2027 年還有</p>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
            <div id="message"></div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="container">
            <div class="row">
                <div class="col l8 s12 footer-left">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」 —— 魯迅</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright grey darken-4">
            <div class="container footer-left">
                &copy; 2022-2026 菜鳥驛站·樂玩公社
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            // 初始化側邊欄
            $('.sidenav').sidenav();

            const futureDate = new Date('2027-01-01T00:00:00+08:00');
            const now = new Date();
            const diff = Math.floor((futureDate.getTime() - now.getTime()) / 1000);

            if (diff > 0) {
                setTimeout(function() {
                    const clock = $('.clock').FlipClock(diff, {
                        clockFace: 'DailyCounter',
                        countdown: true
                    });
                    $('#timer-container').css('opacity', '1');
                }, 300);
            } else {
                $('#message').html('<h5 class="red-text">新的旅程已經開始！</h5>');
            }
        });
    </script>
</body>
