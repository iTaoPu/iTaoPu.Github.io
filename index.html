<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>

    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            background-color: #fcfcfc;
        }
        main { flex: 1 0 auto; }

        /* --- 時鐘基礎容器 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 40px 0;
            opacity: 0;
            transition: opacity 1s;
            min-height: 250px;
        }
        
        .flip-clock-wrapper {
            margin: 0 auto !important;
            display: inline-block !important;
            width: auto !important;
            float: none !important;
        }

        /* 樣式美化 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333 !important;
            color: #ff5252 !important;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 手機端兩行顯示修正方案 --- */
        @media only screen and (max-width: 600px) {
            .flip-clock-wrapper {
                transform: scale(0.65); /* 縮小一點，確保一行放得下兩組數字 */
                transform-origin: center center;
            }

            /* 強制在「小時」之後斷行，確保不會出現單個數字掉下去的情況 */
            /* DailyCounter 結構：Days (2ul) + Divider + Hours (2ul) + Divider + Minutes (2ul) + Divider + Seconds (2ul) */
            
            /* 找到小時後的那個 Divider 並讓它佔滿整行 */
            .flip-clock-divider.hours + .flip-clock-divider {
                clear: both;
                display: block !important;
                float: none !important;
                height: 50px; /* 這裡決定了第一行和第二行的間距 */
                width: 100%;
                visibility: hidden; /* 隱藏這個用來斷行的間距 */
            }

            /* 修正標籤位置，避免斷行後重疊 */
            .flip-clock-divider .flip-clock-label {
                top: auto !important;
                bottom: -2.5em !important;
                right: -86px !important;
            }
        }

        .footer-left { text-align: left !important; }
    </style>
</head>

<body>
    <nav class="grey darken-4">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><a href="/">Home</a></li>
        <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
    </ul>
    
    <main>
        <div class="container center-align">
            <br><br>
            <h1 class="header red-text text-accent-2" style="font-size: 2.5rem;">“閒”是生活的標點</h1>
            <p class="grey-text">距離 2027 年還有</p>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
            <div id="message"></div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="container footer-left">
            <div class="row">
                <div class="col s12">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright grey darken-4">
            <div class="container footer-left">&copy; 2022-2026 菜鳥驛站</div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            const target = new Date('2027-01-01T00:00:00+08:00');
            const diff = Math.floor((target.getTime() - new Date().getTime()) / 1000);

            if (diff > 0) {
                const clock = $('.clock').FlipClock(diff, {
                    clockFace: 'DailyCounter',
                    countdown: true
                });
                $('#timer-container').css('opacity', '1');
            } else {
                $('#message').html('<h5 class="red-text">新的旅程已經開始！</h5>');
            }
        });
    </script>
</body>
</html>
