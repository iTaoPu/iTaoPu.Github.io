<style>
    body {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        background-color: #f5f5f5;
    }

    /* --- PC 端保持原樣 --- */
    .clock-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 40px 0;
        opacity: 0;
        transition: opacity 1s;
    }
    
    .flip-clock-wrapper {
        margin: 0 auto !important;
        display: table !important;
        width: auto !important;
    }

    .flip-clock-wrapper ul li a div div.inn {
        background-color: #333333 !important;
        color: #ff5252 !important;
    }
    .flip-clock-dot { background: #ff5252 !important; }
    .flip-clock-divider .flip-clock-label { color: #757575 !important; font-weight: bold; }

    /* --- 手機端強制三行顯示方案 --- */
    @media only screen and (max-width: 800px) {
        h1.header { font-size: 2.2rem !important; }

        .clock-wrapper {
            padding: 10px 0;
            min-height: 350px; /* 增加高度以容納三行 */
        }

        .flip-clock-wrapper {
            transform: scale(0.8); /* 放大一點，因為三行空間較充裕 */
            transform-origin: center top;
            display: block !important;
            text-align: center;
        }

        /* 統一內部佈局 */
        .flip-clock-wrapper ul { 
            float: none !important;
            display: inline-block !important;
            margin: 5px !important; 
        }
        .flip-clock-divider { 
            float: none !important;
            display: inline-block !important;
            width: 15px !important;
        }

        /* 【第一行結束】：在「天」之後強制換行 */
        .flip-clock-divider.days {
            display: block !important;
            width: 100% !important;
            height: 40px !important;
            float: none !important;
        }

        /* 【第二行結束】：在「分鐘」後的那個間隔處換行 */
        /* 目標是讓「時」和「分」在一起，所以要在分之後的冒號點換行 */
        .flip-clock-divider.minutes + .flip-clock-divider {
            display: block !important;
            clear: both !important;
            width: 100% !important;
            height: 40px !important;
            visibility: hidden;
        }

        /* 隱藏換行用的佔位標籤，避免文字重疊 */
        .flip-clock-divider.days .flip-clock-label {
            display: none; 
        }
        
        .sidenav-trigger { display: block !important; }
    }

    main { flex: 1 0 auto; }
    .footer-left { text-align: left !important; }
</style>
