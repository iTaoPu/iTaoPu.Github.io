<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        /* --- 保持原有的 CSS --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f5f5f5;
            transition: background-color 0.3s; /* 平滑切換背景 */
        }

        /* 深色模式樣式定義 */
        body.dark-mode {
            background-color: #121212;
        }
        body.dark-mode .header-title { color: #ff5252 !important; }
        body.dark-mode .sub-text { color: #757575 !important; }
        body.dark-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #1e1e1e !important; /* 深色模式下時鐘底色稍微加深 */
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 2px;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #9e9e9e;
            margin-bottom: 5px;
        }

        .clock-wrapper {
            width: 100%;
            display: flex;
            justify(content): center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s;
            transform: scale(2.0); 
            margin: 80px 0;
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label {
            display: none !important;
        }

        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 4px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        @media only screen and (max-width: 600px) {
            .clock-wrapper {
                transform: scale(0.75);
                margin: 30px 0;
            }
            .header-title { font-size: 1.1rem !important; }
        }

        .page-footer {
            padding-top: 20px;
        }

        /* 切換按鈕樣式 */
        .theme-toggle-btn {
            cursor: pointer;
            padding: 0 15px;
            display: flex;
            align-items: center;
        }
    </style>
</head>

<body>
    <nav class="grey darken-4">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
                <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
                <li>
                    <a class="theme-toggle-btn" id="theme-btn">
                        <i class="material-icons">brightness_medium</i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><a href="/">Home</a></li>
        <li><a id="mobile-theme-btn" style="cursor:pointer;"><i class="material-icons">brightness_medium</i>切換深淺模式</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
    </ul>
    
    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">北京實時時間</p>
            <div id="bj-date" class="grey-text" style="font-size: 0.8rem; margin-bottom: 20px;"></div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="container">
            <div class="row">
                <div class="col l8 s12 footer-left">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」 —— 魯迅</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright grey darken-4">
            <div class="container footer-left">
                &copy; 2022-2026 菜鳥驛站·樂玩公社
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            // --- 新增：切換按鈕邏輯 ---
            function toggleTheme() {
                $('body').toggleClass('dark-mode');
                // 可選：保存到本地
                const isDark = $('body').hasClass('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            $('#theme-btn, #mobile-theme-btn').on('click', toggleTheme);

            // 讀取本地保存的設定
            if (localStorage.getItem('theme') === 'dark') {
                $('body').addClass('dark-mode');
            }
            // ------------------------

            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-CN', options));
            }

            const clock = $('.clock').FlipClock({
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            const bjNow = getBeijingTime();
            clock.setTime(bjNow);
            updateDate();

            $('#timer-container').css('opacity', '1');
            setInterval(updateDate, 3600000);
        });
    </script>
</body>
</html>
