<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a; 
            color: #ffffff;
            transition: background-color 0.8s ease;
            overflow-x: hidden; /* 防止縮放導致左右捲軸 */
        }

        body { display: flex; flex-direction: column; }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 20px 0;
            cursor: pointer;
        }

        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 4px;
        }

        .sub-text { font-size: 0.9rem; color: #757575; margin-bottom: 5px; }

        /* --- 修復後的時鐘容器 --- */
        .clock-wrapper {
            width: 100%;
            max-width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            /* 修正縮放：上限設為 2.0，確保不溢出螢幕 */
            transform: scale(clamp(0.6, 10vw, 2.0)); 
            transform-origin: center center;
            margin: 100px 0; /* 給予足夠的垂直空間 */
            white-space: nowrap; 
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            display: inline-block !important;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label { display: none !important; }

        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 響應式微調 --- */
        @media only screen and (max-width: 768px) {
            .clock-wrapper { transform: scale(0.8); margin: 60px 0; }
        }
        @media only screen and (max-width: 480px) {
            .clock-wrapper { transform: scale(0.65); margin: 40px 0; }
        }

        .page-footer { padding-top: 20px; background-color: #121212 !important; transition: background-color 0.8s ease; }
        #theme-toggle-fab { position: fixed; right: 20px; bottom: 20px; z-index: 1000; }

        /* 淺色模式 */
        body.light-mode { background-color: #f5f5f5 !important; color: #212121 !important; }
        body.light-mode nav { background-color: #ffffff !important; }
        body.light-mode nav ul a, body.light-mode nav i { color: #424242 !important; }
        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #212121 !important; 
            text-shadow: none !important;
            border: 1px solid rgba(0,0,0,0.1);
        }
        body.light-mode .flip-clock-dot { background: #212121 !important; }
        body.light-mode .page-footer { background-color: #eeeeee !important; }
        body.light-mode .footer-copyright { background-color: #e0e0e0 !important; }
    </style>
</head>

<body>

    <nav class="black">

                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><div class="user-view"><div class="background black"></div><span class="white-text name">蜂巢·隱曜</span></div></li>
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
        <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
        <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>

    </ul>
    
    <main id="main-content">
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">BEIJING TIME</p>
            <div id="bj-date" class="grey-text text-lighten-1" style="font-size: 0.9rem; margin-bottom: 20px; font-weight: 300;"></div>
            <div id="sync-status" style="font-size: 0.85rem; transition: all 0.5s ease;">校準授時中...</div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="container">
            <div class="row">
                <div class="col l8 s12">
                    <h6><a href="https://t.me/CNiao_P" target="_blank" class="white-text">蜂巢·隱曜</a></h6>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            // 全螢幕切換
            $('#main-content').on('dblclick', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => console.log(e));
                } else {
                    document.exitFullscreen();
                }
            });

            // 自動主題
            function autoTheme() {
                if (!localStorage.getItem('theme')) {
                    const hour = getBeijingTime().getHours();
                    if (hour >= 6 && hour < 18) { $('body').addClass('light-mode'); } 
                    else { $('body').removeClass('light-mode'); }
                }
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') { $('body').addClass('light-mode'); } 
            else if (!savedTheme) { autoTheme(); }

            $('#theme-toggle-fab').on('click', function() {
                $('body').toggleClass('light-mode');
                localStorage.setItem('theme', $('body').hasClass('light-mode') ? 'light' : 'dark');
            });

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            // 啟動時鐘
            const bjNow = getBeijingTime();
            const clock = $('.clock').FlipClock(bjNow, {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            setTimeout(function() {
                $('#sync-status').fadeOut(800, function() {
                    $(this).html('<i class="material-icons" style="font-size:14px; vertical-align:middle;">check_circle</i> 蜂巢時間已同步 (UTC+8)')
                           .css('color', '#4caf50').fadeIn();
                });
            }, 1800);
        });
    </script>
</body>
</html>
