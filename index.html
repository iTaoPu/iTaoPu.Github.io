    <style>
        /* --- 頁面結構優化 --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a; 
            color: #ffffff;
            transition: background-color 0.8s ease; /* 讓切換背景更平滑 */
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 40px 0;
            cursor: pointer; /* 提示可點擊全螢幕 */
        }

        /* --- 仿 Time.is 文字比例 --- */
        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 5px;
        }

        /* --- 時鐘巨大化核心 (優化版) --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in, transform 0.3s ease-out;
            /* 增大縮放倍率：最大鎖定在 2.5 倍 */
            transform: scale(clamp(0.65, 12vw, 2.5)); 
            margin: clamp(60px, 15vh, 150px) 0; 
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label {
            display: none !important;
        }

        /* 顏色自定義：深灰底紅字 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 導航欄增強 --- */
        .nav-wrapper ul li a {
            transition: color 0.3s ease, background-color 0.3s ease;
            position: relative;
        }
        .nav-wrapper ul li a:hover {
            color: #ff5252 !important;
            background-color: rgba(255, 255, 255, 0.05) !important;
        }
        .nav-wrapper ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: #ff5252;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        .nav-wrapper ul li a:hover::after { width: 70%; }

        /* --- 移動端適配 --- */
        @media only screen and (max-width: 768px) {
            .clock-wrapper { transform: scale(0.9); margin: 50px 0; }
        }
        @media only screen and (max-width: 480px) {
            .clock-wrapper { transform: scale(0.75); margin: 30px 0; }
            .header-title { font-size: 1rem !important; }
        }

        /* 頁腳修正 */
        .page-footer {
            padding-top: 20px;
            background-color: #121212 !important;
            transition: background-color 0.8s ease;
        }

        /* 右下角切換按鈕 */
        #theme-toggle-fab {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 1000;
        }

        /* --- 淺色模式視覺微調 --- */
        body.light-mode {
            background-color: #f5f5f5 !important;
            color: #212121 !important;
        }
        body.light-mode nav { background-color: #ffffff !important; }
        body.light-mode nav ul a, body.light-mode nav i { color: #424242 !important; }
        
        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #212121 !important; 
            text-shadow: none !important;
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08) !important; /* 增加懸浮立體感 */
        }
        body.light-mode .flip-clock-dot { background: #212121 !important; }
        body.light-mode .page-footer { background-color: #eeeeee !important; }
        body.light-mode .footer-copyright { background-color: #e0e0e0 !important; }
    </style>
</head>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            // 1. 真實時間函數
            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            // 2. 自動晝夜主題背景 (6:00-18:00 淺色)
            function autoTheme() {
                if (!localStorage.getItem('theme')) {
                    const hour = getBeijingTime().getHours();
                    if (hour >= 6 && hour < 18) {
                        $('body').addClass('light-mode');
                    } else {
                        $('body').removeClass('light-mode');
                    }
                }
            }

            // 3. 全螢幕切換 (雙擊空白處)
            $('#main-content').on('dblclick', function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => console.log(e));
                } else {
                    document.exitFullscreen();
                }
            });

            // 4. 防燒屏微動 (每分鐘隨機偏移 1px)
            setInterval(function() {
                const offX = (Math.random() * 2 - 1).toFixed(1);
                const offY = (Math.random() * 2 - 1).toFixed(1);
                @@MATH_BLOCK_0@@{offX}px, ${offY}px)`);
            }, 60000);

            // 5. 初始化與持久化
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                $('body').addClass('light-mode');
            } else if (!savedTheme) {
                autoTheme();
            }

            $('#theme-toggle-fab').on('click', function() {
                $('body').toggleClass('light-mode');
                const isLight = $('body').hasClass('light-mode');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
            });

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            // 6. 啟動時鐘
            const bjNow = getBeijingTime();
            const clock = $('.clock').FlipClock(bjNow, {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            setTimeout(function() {
                $('#sync-status').fadeOut(800, function() {
                    $(this).html('<i class="material-icons" style="font-size:14px; vertical-align:middle;">check_circle</i> 蜂巢時間已同步 (UTC+8)')
                           .css('color', '#4caf50') 
                           .fadeIn();
                });
            }, 1800);

            setInterval(updateDate, 3600000);
        });
    </script>
