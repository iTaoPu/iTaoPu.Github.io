<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        /* --- 基礎背景與結構 --- */
        html, body {
            height: 100%;
            margin: 0;
            background: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #121212 100%);
            color: #ffffff;
            transition: background 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 40px 20px;
        }

        /* --- 文字與標題 --- */
        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 5px;
        }

        /* --- 核心：磨砂玻璃框樣式 --- */
        .clock-wrapper {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            transform: scale(clamp(0.6, 7vw, 1.2)); 
            margin: clamp(20px, 5vh, 50px) auto;

            /* 磨砂玻璃效果 */
            padding: 40px 60px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            /* 邊框與光影細節 */
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label { display: none !important; }

        /* 時鐘數字顏色 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 淺色模式 --- */
        body.light-mode {
            background: radial-gradient(circle at 50% 50%, #fdfdfd 0%, #f5f5f5 100%) !important;
            color: #212121 !important;
        }
        body.light-mode .clock-wrapper {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }
        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #000000 !important;
            border: 1px solid #ddd;
        }
        body.light-mode .flip-clock-dot { background: #000000 !important; }
        body.light-mode nav { background-color: #ffffff !important; }
        body.light-mode nav ul a, body.light-mode nav i { color: #424242 !important; }

        /* --- 導航與交互 --- */
        nav.black { background-color: rgba(0,0,0,0.8) !important; backdrop-filter: blur(5px); }
        .nav-wrapper ul li a:hover { color: #ff5252 !important; background-color: transparent !important; }
        
        #theme-toggle-fab { position: fixed; right: 20px; bottom: 20px; z-index: 1000; }
        #theme-toggle-fab a { width: 45px; height: 45px; line-height: 45px; }

        footer { background-color: #121212 !important; padding-top: 15px; }
        .footer-copyright { background-color: #000 !important; padding: 10px 0 !important; }
    </style>
</head>

<body>
    <div id="theme-toggle-fab">
        <a class="btn-floating waves-effect waves-light red">
            <i class="material-icons">brightness_medium</i>
        </a>
    </div>

    <nav class="black">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>

                <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
                <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><div class="user-view"><div class="background black"></div><span class="white-text name">蜂巢·隱曜</span></div></li>
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
        <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
        <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
        <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
        <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
    </ul>
    <main>
        <div class="center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">BEIJING TIME</p>
            <div id="bj-date" class="grey-text text-lighten-1" style="font-size: 0.9rem; margin-bottom: 20px;"></div>
            <div id="sync-status" style="font-size: 0.8rem; margin-bottom: 10px; color: #757575;">校準中...</div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="container">
            <div class="row" style="margin-bottom: 0;">
                <div class="col s12 center-align">
                    <h6 style="font-size: 0.9rem;"><a href="https://t.me/CNiao_P" target="_blank" style="color:#ff5252;">蜂巢·隱曜</a></h6>
                    <p class="grey-text text-lighten-1" style="font-size: 0.8rem;">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」</p>
                </div>

        <div class="footer-copyright">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            // 主題保存
            if (localStorage.getItem('theme') === 'light') $('body').addClass('light-mode');

            $('#theme-toggle-fab').on('click', function() {
                $('body').toggleClass('light-mode');
                localStorage.setItem('theme', $('body').hasClass('light-mode') ? 'light' : 'dark');
            });

            // 北京時間計算
            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            // 初始化時鐘
            const bjNow = getBeijingTime();
            $('.clock').FlipClock(bjNow, {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            setTimeout(() => {
                $('#sync-status').html('<i class="material-icons" style="font-size:12px; vertical-align:middle;">check_circle</i> 蜂巢時間已同步 (UTC+8)').css('color', '#4caf50');
            }, 1500);

            setInterval(updateDate, 3600000);
        });
    </script>
</body>
</html>
