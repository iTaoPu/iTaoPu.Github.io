<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        /* --- 頁面結構優化 --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a; 
            color: #ffffff;
            transition: background-color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 40px 0;
        }

        /* --- 文字比例 --- */
        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 5px;
        }

        /* --- 時鐘巨大化與標籤注入 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            transform: scale(1.8); 
            margin: 100px 0; 
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
            padding-bottom: 30px !important; /* 為標籤留空間 */
        }

        /* 使用 CSS 偽元素在不改動 HTML 下增加「時分秒」標籤 */
        .flip-clock-divider { position: relative; }
        .flip-clock-divider:before {
            position: absolute;
            bottom: -35px;
            font-size: 10px;
            font-weight: 300;
            color: #ff5252;
            letter-spacing: 1px;
            white-space: nowrap;
            opacity: 0.8;
        }
        .flip-clock-divider.hours:before { content: "時 HOUR"; left: 48px; }
        .flip-clock-divider.minutes:before { content: "分 MIN"; left: 48px; }
        .flip-clock-divider.seconds:before { content: "秒 SEC"; left: 48px; }

        .flip-clock-divider .flip-clock-label { display: none !important; }

        /* 顏色自定義：深灰底紅字 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 導航欄與連結 --- */
        .nav-wrapper ul li a {
            transition: color 0.3s ease, background-color 0.3s ease;
            position: relative;
        }
        .nav-wrapper ul li a:hover { color: #ff5252 !important; background-color: rgba(255, 255, 255, 0.05) !important; }
        .footer-links li { margin-bottom: 5px; }

        /* --- 移動端適配 --- */
        @media only screen and (max-width: 768px) {
            .clock-wrapper { transform: scale(0.85); margin: 40px 0; }
        }
        @media only screen and (max-width: 480px) {
            .clock-wrapper { transform: scale(0.75); margin: 20px 0; }
            .header-title { font-size: 1rem !important; }
            .flip-clock-divider:before { font-size: 8px; bottom: -25px; }
        }

        /* --- 淺色模式 --- */
        body.light-mode { background-color: #f5f5f5 !important; color: #212121 !important; }
        body.light-mode nav { background-color: #ffffff !important; }
        body.light-mode nav ul a, body.light-mode nav i { color: #424242 !important; }
        body.light-mode .flip-clock-divider:before { color: #616161 !important; }
        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #000000 !important; 
            text-shadow: none !important;
            border: 1px solid #ddd;
        }
        body.light-mode .flip-clock-dot { background: #000000 !important; }
        body.light-mode .page-footer { background-color: #eeeeee !important; }
        body.light-mode .page-footer h5, body.light-mode .page-footer h6, body.light-mode .page-footer p, body.light-mode .footer-copyright { color: #616161 !important; }
        body.light-mode .footer-copyright { background-color: #e0e0e0 !important; }

        .page-footer { padding-top: 20px; background-color: #121212 !important; }
        #theme-toggle-fab { position: fixed; right: 20px; bottom: 20px; z-index: 1000; }
    </style>
</head>

<body>

    <nav class="black">

                <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><div class="user-view"><div class="background black"></div><span class="white-text name">蜂巢·隱曜</span></div></li>
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>

    </ul>
    
    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">BEIJING TIME</p>
            <div id="bj-date" class="grey-text text-lighten-1" style="font-size: 0.9rem; margin-bottom: 20px; font-weight: 300;"></div>
            <div id="sync-status" style="font-size: 0.85rem; transition: all 0.5s ease;">校準授時中...</div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="container">
            <div class="row">
                <div class="col l8 s12">
                    <h5 class="white-text">蜂巢·隱曜</h5>

                    <h6 class="white-text">公益服務</h6>

        </div>
        <div class="footer-copyright black">
            <div class="container grey-text text-darken-1">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') { $('body').addClass('light-mode'); }

            $('#theme-toggle-fab').on('click', function() {
                $('body').toggleClass('light-mode');
                localStorage.setItem('theme', $('body').hasClass('light-mode') ? 'light' : 'dark');
            });

            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            const bjNow = getBeijingTime();
            const clock = $('.clock').FlipClock(bjNow, {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            setTimeout(function() {
                $('#sync-status').fadeOut(800, function() {
                    $(this).html('<i class="material-icons" style="font-size:14px; vertical-align:middle;">check_circle</i> 蜂巢時間已同步 (UTC+8)')
                           .css('color', '#4caf50') 
                           .fadeIn();
                });
            }, 1800);

            setInterval(updateDate, 3600000);
        });
    </script>
</body>
