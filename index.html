<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f5f5f5;
            overflow-x: hidden; /* 防止縮放時出現水平捲軸 */
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 2px;
        }

        /* --- 寬度自適應核心容器 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s;
            transform-origin: center center; /* 以中心為縮放原點 */
            margin: 40px 0; 
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            display: inline-block !important; /* 確保寬度由內容撐開 */
            width: auto !important;
        }

        /* 樣式美化：隱藏標籤與顏色自定義 */
        .flip-clock-divider .flip-clock-label { display: none !important; }
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            border-radius: 4px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        .page-footer { padding-top: 20px; }
    </style>
</head>

<body>

        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
                <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
                <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
                <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
        <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
        <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
        <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
        <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
    </ul>
    
    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">北京時間</p>
            <div id="bj-date" class="grey-text" style="font-size: 0.8rem; margin-bottom: 20px;"></div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="container">
            <div class="row">
                <div class="col l8 s12 footer-left">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」 —— 魯迅</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright grey darken-4">
            <div class="container footer-left">
                &copy; 2022-2026 菜鳥驛站·樂玩公社
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            // 1. 動態縮放邏輯
            function handleResize() {
                const @@MATH_BLOCK_0@@('#timer-container');
                const @@MATH_BLOCK_1@@('main');
                const containerWidth = $main.width();
                const clockOriginalWidth = 620; // FlipClock 24h 模式的原始像素寬度
                
                // 計算縮放比例：視窗寬度的 90% 除以時鐘原始寬度
                let scale = (containerWidth * 0.9) / clockOriginalWidth;
                
                // 限制最大縮放值，避免在超大螢幕上過於模糊
                if (scale > 2.5) scale = 2.5; 
                
                @@MATH_BLOCK_2@@{scale})`);
                
                // 動態調整容器高度，補償 scale 縮放後遺留的空白
                const scaledHeight = 160 * scale; 
                $wrapper.css('height', scaledHeight + 'px');
            }

            // 2. 時間獲取與更新
            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-CN', options));
            }

            // 3. 初始化時鐘
            const clock = $('.clock').FlipClock({
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            const bjNow = getBeijingTime();
            clock.setTime(bjNow);
            updateDate();

            // 執行一次縮放並顯示
            handleResize();
            $('#timer-container').css('opacity', '1');

            // 監聽視窗大小改變事件
            $(window).on('resize', handleResize);

            // 每小時更新一次日期
            setInterval(updateDate, 3600000);
        });
    </script>
</body>
