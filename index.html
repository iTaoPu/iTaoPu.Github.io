<!DOCTYPE html>

    <link rel="stylesheet" href="https://iTaoPu.GitHub.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>“閒”是生活的標點</title>

    <style>
        /* 頁面基礎布局 */
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            background-color: #f5f5f5;
        }

        /* --- FlipClock 視覺美化 --- */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important; /* 深色卡片 */
            color: #ff5252 !important;           /* 珊瑚紅數字 */
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        
        .flip-clock-dot {
            background: #ff5252 !important;      /* 紅色間隔點 */
            box-shadow: none !important;
        }

        .flip-clock-divider .flip-clock-label {
            color: #757575 !important;           /* 標籤文字顏色 */
            font-weight: bold;
        }

        /* 時鐘容器與動畫 */
        .clock-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 40px 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        
        .clock-wrapper.loaded {
            opacity: 1;
        }

        /* --- 響應式適配 --- */
        @media only screen and (max-width: 600px) {
            h1.header {
                font-size: 2.2rem !important;
                margin-top: 2rem;
                letter-spacing: 2px;
            }

            .clock {
                /* 手機端縮放，並修正 transform 產生的偏移 */
                transform: scale(0.65);
                transform-origin: center center;
                margin: -40px 0 !important; 
            }
            
            .clock-wrapper {
                padding: 20px 0;
                overflow: hidden;
            }
        }

        @media only screen and (min-width: 601px) and (max-width: 992px) {
            .clock {
                transform: scale(0.85);
            }
        }

        main {
            flex: 1 0 auto;
        }
    </style>
</head>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js"></script>
    <script src="https://iTaoPu.GitHub.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            // 初始化側邊欄
            $('.sidenav').sidenav();

            // 設定目標時間
            const futureDate = new Date('2027-01-01T00:00:00+08:00');
            const now = new Date();
            const diff = Math.floor((futureDate - now) / 1000);

            if (diff > 0) {
                // 初始化 FlipClock
                const clock = $('.clock').FlipClock(diff, {
                    clockFace: 'DailyCounter',
                    countdown: true
                });
                
                // 漸現顯示時鐘
                $('.clock-wrapper').addClass('loaded');
            } else {
                $('.message').html('<h5 class="red-text">新的旅程已經開始！</h5>');
                $('.clock-wrapper').hide();
            }
        });
    </script>
