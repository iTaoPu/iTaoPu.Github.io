<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        /* --- 頁面基礎樣式 --- */
        html, body {
            height: 100%;
            margin: 0;
            /* 使用漸變背景讓磨砂感更明顯 */
            background: radial-gradient(circle at center, #2c2c2c 0%, #1a1a1a 100%) !important;
            color: #ffffff;
            transition: background-color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 20px 0;
        }

        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 5px;
        }

        /* --- 核心：精簡版磨砂玻璃框 --- */
        .clock-wrapper {
            display: inline-flex; /* 讓容器寬度隨內容自動縮小 */
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            /* 縮小比例：限制最大縮放，避免過大 */
            transform: scale(clamp(0.6, 6vw, 1.1)); 
            margin: 20px auto; 

            /* 磨砂外框參數 */
            padding: 15px 25px;       /* 縮小內邊距，讓框框緊貼時鐘 */
            border-radius: 18px;      /* 圓角同步縮小 */
            background: rgba(255, 255, 255, 0.06); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* 邊緣微光與陰影 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        
        /* 移除 FlipClock 默認邊距，確保在小框內置中 */
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label {
            display: none !important;
        }

        /* 數字樣式：深灰底紅字 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 淺色模式 --- */
        body.light-mode {
            background: #f5f5f5 !important;
            color: #212121 !important;
        }
        body.light-mode .clock-wrapper {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #000000 !important; 
            border: 1px solid #ddd;
        }
        body.light-mode .flip-clock-dot { background: #000000 !important; }
        
        /* 導航與按鈕 */
        nav.black { background-color: rgba(0,0,0,0.8) !important; }
        #theme-toggle-fab { position: fixed; right: 20px; bottom: 20px; z-index: 1000; }
        .page-footer { background-color: #121212 !important; }
        .footer-copyright { background-color: #000 !important; }
    </style>
</head>

<body>
    <div id="theme-toggle-fab">
        <a class="btn-floating waves-effect waves-light red">
            <i class="material-icons">brightness_medium</i>
        </a>
    </div>

    <nav class="black">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
                <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
                <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
                <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><div class="user-view"><div class="background black"></div><span class="white-text name">蜂巢·隱曜</span></div></li>
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
    </ul>
    
    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">BEIJING TIME</p>
            <div id="bj-date" class="grey-text text-lighten-1" style="font-size: 0.9rem; margin-bottom: 15px; font-weight: 300;"></div>
            <div id="sync-status" style="font-size: 0.8rem; margin-bottom: 10px;">校準授時中...</div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="container center-align">
            <h6 style="font-size: 0.9rem;"><a href="https://t.me/CNiao_P" target="_blank" style="color:#ff5252;">蜂巢·隱曜</a></h6>
            <p class="grey-text text-lighten-1" style="font-size: 0.8rem;">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」</p>
        </div>
        <div class="footer-copyright">
            <div class="container center-align grey-text text-darken-1" style="font-size: 0.7rem;">
                &copy; 2022-2026 菜鳥驛站·樂玩公社
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') $('body').addClass('light-mode');

            $('#theme-toggle-fab').on('click', function() {
                $('body').toggleClass('light-mode');
                localStorage.setItem('theme', $('body').hasClass('light-mode') ? 'light' : 'dark');
            });

            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            const bjNow = getBeijingTime();
            const clock = $('.clock').FlipClock(bjNow, {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            setTimeout(function() {
                $('#sync-status').fadeOut(500, function() {
                    $(this).html('<i class="material-icons" style="font-size:12px; vertical-align:middle;">check_circle</i> 蜂巢時間已同步')
                           .css('color', '#4caf50').fadeIn();
                });
            }, 1500);

            setInterval(updateDate, 3600000);
        });
    </script>
</body>
</html>
