<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        /* --- 基礎變量 --- */
        :root {
            --bg-color: #f5f5f5;
            --text-color: #212121;
            --clock-bg: #333333;
            --clock-text: #ff5252;
            --footer-bg: #424242;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #eeeeee;
            --clock-bg: #222222;
            --clock-text: #ff5252;
            --footer-bg: #000000;
        }

        html, body {
            height: 100%;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        body { display: flex; flex-direction: column; }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 20px 0;
            overflow-x: hidden;
        }

        /* --- 標題與日期 --- */
        .header-title {
            font-size: 1.4rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: var(--clock-text);
            letter-spacing: 4px;
        }

        #bj-date {
            font-family: "Monaco", monospace;
            font-size: 0.9rem;
            margin-bottom: 30px;
            color: #9e9e9e;
        }

        /* --- 時鐘核心與自適應 --- */
        .clock-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s;
            /* PC 預設放大 */
            transform: scale(1.6);
            margin: 100px 0;
        }

        /* 自定義時分秒文字 */
        .time-labels {
            display: flex;
            justify-content: space-between;
            width: 460px; /* 對應 FlipClock 的寬度 */
            margin-top: 15px;
            color: var(--clock-text);
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .flip-clock-divider .flip-clock-label { display: none !important; }

        .flip-clock-wrapper ul li a div div.inn {
            background-color: var(--clock-bg) !important;
            color: var(--clock-text) !important;
        }
        .flip-clock-dot { background: var(--clock-text) !important; }

        /* --- 移動端極致自適應 --- */
        @media only screen and (max-width: 768px) {
            .clock-wrapper { transform: scale(1.1); margin: 60px 0; }
            .time-labels { width: 320px; font-size: 0.9rem; }
        }
        @media only screen and (max-width: 450px) {
            .clock-wrapper { transform: scale(0.75); margin: 20px 0; }
            .time-labels { width: 220px; font-size: 0.8rem; letter-spacing: 1px; }
        }

        /* --- 主題切換按鈕 --- */
        .theme-switch {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
        }

        footer { background-color: var(--footer-bg) !important; transition: background-color 0.3s; }
    </style>
</head>

<body data-theme="dark"> <nav class="grey darken-4">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo center" style="font-size: 1.2rem;">北京時間</a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <div id="bj-date">同步校時中...</div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
                <div class="time-labels">
                    <span>時</span>
                    <span>分</span>
                    <span>秒</span>
                </div>
            </div>
        </div>
    </main>

    <div class="theme-switch">
        <a class="btn-floating btn-large waves-effect waves-light red" id="toggle-theme">
            <i class="material-icons">brightness_medium</i>
        </a>
    </div>

    <footer class="page-footer">
        <div class="footer-copyright">
            <div class="container center-align">
                &copy; 2022-2026 菜鳥驛站·樂玩公社
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            let timeOffset = 0;

            // 1. 深淺模式切換邏輯
            $('#toggle-theme').click(function() {
                const currentTheme = $('body').attr('data-theme');
                if (currentTheme === 'dark') {
                    $('body').attr('data-theme', 'light');
                    $(this).find('i').text('brightness_2');
                } else {
                    $('body').attr('data-theme', 'dark');
                    $(this).find('i').text('brightness_high');
                }
            });

            // 2. 網絡精確校時
            async function syncTime() {
                try {
                    const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Shanghai');
                    const data = await response.json();
                    timeOffset = new Date(data.datetime).getTime() - Date.now();
                } catch (err) {
                    timeOffset = 0;
                }
                updateDate();
            }

            function getCalibratedTime() {
                const now = new Date(Date.now() + timeOffset);
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getCalibratedTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-CN', options));
            }

            // 3. 初始化時鐘
            const clock = $('.clock').FlipClock({
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            syncTime().then(() => {
                clock.setTime(getCalibratedTime());
                $('#timer-container').css('opacity', '1');
            });

            setInterval(updateDate, 60000);
            setInterval(syncTime, 600000);
        });
    </script>
</body>
</html>
