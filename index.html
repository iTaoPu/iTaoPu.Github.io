    <main style="flex: 1 0 auto; display: flex;">
        <div class="container">
            <div class="section Message">
                <div class="clock card-panel hoverable" style="display: inline-block;"></div>
                <div class="message"></div>
                <script type="text/javascript">
                    // 检测设备类型
                    let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                    
                    // 添加window.onload事件处理程序
                    function setupMobileView() {
                        const clockElement = document.querySelector('.clock');
                        const messageElement = document.querySelector('.message');
                        
                        // 移动设备专用样式
                        if (isMobile) {
                            document.body.classList.add('mobile-view');
                            
                            // 时钟特殊样式
                            clockElement.style.fontSize = '40px';
                            clockElement.style.minWidth = '140px';
                            
                            // 消息区域特殊样式
                            messageElement.style.display = 'flex';
                            messageElement.style.justifyContent = 'center';
                            messageElement.style.alignItems = 'center';
                            messageElement.style.minHeight = '40px';
                            
                            // 自定义倒计时功能
                            const futureDate = new Date('2027-01-01T00:00:00+08:00');
                            let diff = Math.floor((futureDate - new Date()) / 1000);
                            let timer;
                            
                            // 为时钟添加简化版显示
                            updateMobileClock();
                            
                            function updateMobileClock() {
                                if (diff <= 0) {
                                    clearInterval(timer);
                                    messageElement.innerHTML = '<h5 class="red-text">倒计时结束！</h5>';
                                    return;
                                }
                                
                                // 显示简化版倒计时 (天/小时/分钟)
                                const hours = Math.floor(diff / 3600 / 24) % 24;
                                const minutes = Math.floor((diff / 60) % 60);
                                
                                timer = setTimeout(updateMobileClock, 1000);
                            }
                            
                            // 启动简化版时钟
                            updateMobileClock();
                            
                            // 检测屏幕变化
                            window.addEventListener('resize', function() {
                                // 如果切换到桌面视图，则恢复原样式
                                if (!isMobile && !document.body.classList.contains('mobile-view')) {
                                    document.body.classList.remove('mobile-view');
                                    
                                    if (window.FlipClock) {
                                        const flipClock = clockElement.querySelector('flip-clock');
                                        if (flipClock) flipClock.remove();
                                        
                                        // 初始化FlipClock
                                        const clock = $('.clock').FlipClock(diff, {
                                            clockFace: 'DailyCounter',
                                            countdown: true,
                                            autoStart: true
                                        });
                                        
                                        messageElement.innerHTML = '<h5 class="green-text" style="margin:15px 0;">活动进行中！</h5>';
                                    }
                                }
                            });
                        } else {
                            // 桌面设备处理
                            // 原HTML中的FlipClock代码在这里，不需要额外添加
                        }
                    }
                    
                    // 确保在页面加载完成后运行
                    window.addEventListener('load', setupMobileView);
                </script>
            </div>
        </div>
