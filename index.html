<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        /* --- 頁面結構優化 --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #1a1a1a; 
            color: #ffffff;
            transition: background-color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 40px 0;
        }

        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #757575;
            margin-bottom: 5px;
        }

        /* --- 時鐘巨大化核心 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            transform: scale(1.8); 
            margin: 100px 0; 
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        .flip-clock-divider .flip-clock-label { display: none !important; }

        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 6px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 導航欄增強 --- */
        .nav-wrapper ul li a {
            transition: color 0.3s ease;
            position: relative;
        }
        .nav-wrapper ul li a:hover {
            color: #ff5252 !important;
            background-color: rgba(255, 255, 255, 0.05) !important;
        }
        .nav-wrapper ul li a::after {
            content: '';
            position: absolute;
            width: 0; height: 2px; bottom: 0; left: 50%;
            background-color: #ff5252;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        .nav-wrapper ul li a:hover::after { width: 70%; }

        /* --- 移動端適配 --- */
        @media only screen and (max-width: 768px) {
            .clock-wrapper { transform: scale(0.85); margin: 40px 0; }
        }
        @media only screen and (max-width: 480px) {
            .clock-wrapper { transform: scale(0.7); margin: 20px 0; }
            .header-title { font-size: 1rem !important; }
        }

        /* 頁腳樣式 */
        .page-footer {
            padding-top: 20px;
            background-color: #121212 !important;
            transition: background-color 0.3s ease;
        }

        /* 頁腳內的主題按鈕微調 */
        .theme-btn-footer {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            padding: 8px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .theme-btn-footer:hover {
            background-color: #ff5252;
            border-color: #ff5252;
            color: #fff !important;
        }
        .theme-btn-footer i { margin-right: 8px; font-size: 1.2rem; }

        /* --- 淺色模式 --- */
        body.light-mode { background-color: #f5f5f5 !important; color: #212121 !important; }
        body.light-mode nav { background-color: #ffffff !important; }
        body.light-mode nav ul a, body.light-mode nav i { color: #424242 !important; }
        body.light-mode .nav-wrapper ul li a:hover { color: #ff5252 !important; }
        body.light-mode .flip-clock-wrapper ul li a div div.inn {
            background-color: #ffffff !important;
            color: #000000 !important; 
            border: 1px solid #ddd;
        }
        body.light-mode .flip-clock-dot { background: #000000 !important; }
        body.light-mode .page-footer { background-color: #eeeeee !important; }
        body.light-mode .page-footer h5, body.light-mode .page-footer p, body.light-mode .footer-copyright { color: #616161 !important; }
        body.light-mode .footer-copyright { background-color: #e0e0e0 !important; }
        body.light-mode .theme-btn-footer { border-color: rgba(0,0,0,0.1); color: #616161; }
    </style>
</head>

<body>
    <nav class="black">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">

                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><div class="user-view"><div class="background black"></div><span class="white-text name">蜂巢·隱曜</span></div></li>
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
        <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
        <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
        <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
        <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
    </ul>
    
    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">BEIJING TIME</p>
            <div id="bj-date" class="grey-text text-lighten-1" style="font-size: 0.9rem; margin-bottom: 20px; font-weight: 300;"></div>
            <div id="sync-status" style="font-size: 0.85rem;">校準授時中...</div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="container">
            <div class="row">
                <div class="col l8 s12">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」 —— 魯迅</p>
                </div>
                <div class="col l4 s12 right-align">
                    <div id="theme-toggle" class="theme-btn-footer grey-text text-lighten-1">
                        <i class="material-icons">brightness_medium</i>
                        <span>切換外觀模式</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer-copyright black">
            <div class="container grey-text text-darken-1">
                &copy; 2022-2026 菜鳥驛站·樂玩公社
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            // 主題記憶
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') { $('body').addClass('light-mode'); }

            // 頁腳按鈕點擊
            $('#theme-toggle').on('click', function() {
                $('body').toggleClass('light-mode');
                localStorage.setItem('theme', $('body').hasClass('light-mode') ? 'light' : 'dark');
            });

            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-Hant-TW', options));
            }

            const clock = $('.clock').FlipClock(getBeijingTime(), {
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            updateDate();
            $('#timer-container').css('opacity', '1');

            setTimeout(function() {
                $('#sync-status').fadeOut(800, function() {
                    $(this).html('<i class="material-icons" style="font-size:14px; vertical-align:middle;">check_circle</i> 原子時間已同步')
                           .css('color', '#4caf50').fadeIn();
                });
            }, 1800);

            setInterval(updateDate, 3600000);
        });
    </script>
</body>
</html>
