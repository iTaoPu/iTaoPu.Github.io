<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;    
            padding: 20px;
            width: 100%;
            min-height: 400px; /* 確保中間有足夠空間 */
        }

        .header-title {
            font-size: 1.2rem !important;
            font-weight: 300;
            margin: 0 0 10px 0 !important;
            color: #ff5252;
            letter-spacing: 2px;
        }

        /* 時鐘容器 */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; /* 初始隱藏，由 JS 顯示 */
            transition: opacity 0.8s ease-in;
            transform-origin: center center;
            margin: 20px 0;
        }
        
        /* 修正 FlipClock 內部樣式 */
        .flip-clock-wrapper {
            display: inline-block !important;
            width: auto !important;
            margin: 0 !important;
        }

        .flip-clock-divider .flip-clock-label { display: none !important; }
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            border-radius: 4px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        .page-footer { padding-top: 20px; }
    </style>
</head>

<body>
    <nav class="grey darken-4">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
                <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
    </ul>
    
    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">北京時間</p>
            <div id="bj-date" class="grey-text" style="font-size: 0.8rem; margin-bottom: 10px;"></div>
            
            <div style="width:100%; display:flex; justify-content:center;">
                <div class="clock-wrapper" id="timer-container">
                    <div class="clock"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="container">
            <div class="row">
                <div class="col l8 s12">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般...」</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright grey darken-4">
            <div class="container"> &copy; 2022-2026 菜鳥驛站·樂玩公社 </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            const @@MATH_BLOCK_0@@('#timer-container');
            const clockOriginalWidth = 620; 

            function handleResize() {
                const containerWidth = $('main').width();
                let scale = (containerWidth * 0.95) / clockOriginalWidth;
                
                // 行動端適配：如果是手機螢幕，比例再縮小一點防止溢出
                if (containerWidth < 500) scale = (containerWidth * 0.9) / clockOriginalWidth;
                if (scale > 2.2) scale = 2.2; 

                $wrapper.css({
                    'transform': 'scale(' + scale + ')',
                    'height': (160 * scale) + 'px'
                });
            }

            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-CN', options));
            }

            // 初始化時鐘
            try {
                const clock = $('.clock').FlipClock({
                    clockFace: 'TwentyFourHourClock',
                    showSeconds: true
                });

                const bjNow = getBeijingTime();
                clock.setTime(bjNow);
                updateDate();

                // 重要：延遲執行縮放計算，確保 FlipClock 結構已生成
                setTimeout(function() {
                    handleResize();
                    $wrapper.css('opacity', '1');
                }, 200);

            } catch (e) {
                console.error("時鐘初始化失敗:", e);
                // 如果失敗，嘗試直接顯示
                $wrapper.css('opacity', '1');
            }

            $(window).on('resize', handleResize);
            setInterval(updateDate, 3600000);
        });
    </script>
</body>
</html>
