<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>“閒”是生活的標點 - 北京時間</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="https://iTaoPu.Github.io/css/flipclock.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://iTaoPu.Github.io/Jing.png"/>
    
    <style>
        /* --- 頁面結構優化 --- */
        html, body {
            height: 100%;
            margin: 0;
            background-color: #f5f5f5; /* 保持原有的淺灰背景，或改為 #000 模擬 Time.is */
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 垂直居中核心 */
            align-items: center;    /* 水平居中核心 */
            padding: 20px 0;
        }

        /* --- 仿 Time.is 文字比例 --- */
        .header-title {
            font-size: 1.2rem !important; /* 標題縮小 */
            font-weight: 300;
            margin: 0 !important;
            color: #ff5252;
            letter-spacing: 2px;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #9e9e9e;
            margin-bottom: 5px;
        }

        /* --- 時鐘巨大化核心 --- */
        .clock-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s;
            /* PC 端超大縮放 */
            transform: scale(2.0); 
            margin: 80px 0; /* 補償放大後的佔位 */
        }
        
        .flip-clock-wrapper {
            margin: 0 !important;
            display: flex !important;
            justify-content: center;
            width: auto !important;
        }

        /* 隱藏 天、時、分、秒 標籤文字 */
        .flip-clock-divider .flip-clock-label {
            display: none !important;
        }

        /* 顏色自定義：深灰底紅字 */
        .flip-clock-wrapper ul li a div div.inn {
            background-color: #333333 !important;
            color: #ff5252 !important;
            text-shadow: 0 1px 2px #000;
            border-radius: 4px;
        }
        .flip-clock-dot { background: #ff5252 !important; }

        /* --- 移動端適配 --- */
        @media only screen and (max-width: 600px) {
            .clock-wrapper {
                transform: scale(0.75); /* 手機端縮放，避免數字跑出螢幕 */
                margin: 30px 0;
            }
            .header-title { font-size: 1.1rem !important; }
        }

        /* 頁腳樣式修正 */
        .page-footer {
            padding-top: 20px;
        }
    </style>
</head>

<body>
    <nav class="grey darken-4">
        <div class="nav-wrapper container">
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down">
                <li><a href="/">Home</a></li>
                <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
                <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
                <li><a href="https://5iclub.blogspot.com" target="_blank">Blogspot</a></li>
                <li><a href="https://vlink.cc/CNiao" target="_blank">菜鳥驛站</a></li>
                <li><a href="https://ifdian.net/a/CNiao" target="_blank">愛發電</a></li>
            </ul>
        </div>
    </nav>

    <ul class="sidenav" id="nav-mobile">
        <li><a href="/">Home</a></li>
        <li><a href="https://adrules.ifanr.pp.ua" target="_blank">AdRules</a></li>
        <li><a href="https://status.ifanr.pp.ua" target="_blank">服務監控</a></li>
    </ul>
    
    <main>
        <div class="container center-align">
            <h1 class="header-title">“閒”是生活的標點</h1>
            <p class="sub-text">北京實時時間</p>
            <div id="bj-date" class="grey-text" style="font-size: 0.8rem; margin-bottom: 20px;"></div>
            
            <div class="clock-wrapper" id="timer-container">
                <div class="clock"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer grey darken-3">
        <div class="container">
            <div class="row">
                <div class="col l8 s12 footer-left">
                    <h5 class="white-text">蜂巢·隱曜</h5>
                    <p class="grey-text text-lighten-1">「人的白嫖，就如同高山滾石一般，一旦開始，就再也停不下了」 —— 魯迅</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright grey darken-4">
            <div class="container footer-left">
                &copy; 2022-2026 菜鳥驛站·樂玩公社
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://iTaoPu.Github.io/js/flipclock.js"></script>
    
    <script type="text/javascript">
        $(document).ready(function() {
            $('.sidenav').sidenav();

            // 精確獲取北京時間 (UTC+8)
            function getBeijingTime() {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                return new Date(utc + (3600000 * 8));
            }

            // 更新日期顯示
            function updateDate() {
                const bjNow = getBeijingTime();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                $('#bj-date').text(bjNow.toLocaleDateString('zh-CN', options));
            }

            // 初始化時鐘為 24 小時模式
            const clock = $('.clock').FlipClock({
                clockFace: 'TwentyFourHourClock',
                showSeconds: true
            });

            // 設定初始北京時間
            const bjNow = getBeijingTime();
            clock.setTime(bjNow);
            updateDate();

            // 顯示時鐘容器
            $('#timer-container').css('opacity', '1');

            // 每小時更新一次日期文字
            setInterval(updateDate, 3600000);
        });
    </script>
</body>
</html>
