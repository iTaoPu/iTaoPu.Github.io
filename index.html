    <style>
        /* 页面基础布局优化 */
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        /* 手机端适配样式 */
        @media only screen and (max-width: 600px) {
            /* 调整大标题字号，防止折行过碎 */
            h1.header {
                font-size: 2.8rem !important;
                margin-top: 1rem;
            }

            /* 【核心修复】FlipClock 手机端缩放 */
            /* 因为 FlipClock 宽度是固定的，在手机上会溢出，所以通过 scale 缩小 */
            .clock {
                transform: scale(0.55); /* 缩小到 55% */
                transform-origin: center top;
                margin-bottom: -60px; /* 抵消缩放产生的多余留白 */
            }

            .section {
                padding-bottom: 0 !important;
            }
        }

        /* 平板端适配样式 */
        @media only screen and (min-width: 601px) and (max-width: 992px) {
            .clock {
                transform: scale(0.8);
                transform-origin: center top;
                margin-bottom: -30px;
            }
        }

        /* 修复时钟容器在各端的居中显示 */
        .clock-wrapper {
            display: flex;
            justify-content: center;
            overflow: visible;
            width: 100%;
        }
    </style>

    <script src="https://loong.sspai.pp.ua/js/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js></script>
    <script src="https://loong.sspai.pp.ua/js/flipclock.js"></script>
    <script type="text/javascript">
        var clock;
        $(document).ready(function() {
            // 初始化 Materialize 侧边栏
            $('.sidenav').sidenav();

            // 设置固定目标时间（北京时间2027年1月1日）
            const futureDate = new Date('2027-01-01T00:00:00+08:00');

            function updateClock() {
                const now = new Date();
                const diff = Math.floor((futureDate - now) / 1000);

                if (diff <= 0) {
                    if(clock) {
                        clock.stop();
                        $('.message').html('<h5 class="red-text">倒计时已结束！</h5>');
                    }
                    return;
                }

                if (!clock) {
                    clock = $('.clock').FlipClock(diff, {
                        clockFace: 'DailyCounter',
                        countdown: true,
                        autoStart: false,
                        callbacks: {
                            stop: function() {
                                $('.message').html('<h5 class="green-text">活动进行中！</h5>');
                            }
                        }
                    }).start();
                } else {
                    clock.setTime(diff);
                    clock.start();
                }
            }

            setInterval(updateClock, 1000);
            updateClock();
        });
    </script>
